name: Love Office CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: love-office-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  story:
    name: story-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-story.txt
      - name: Install locked story dependencies
        run: python -m pip install --require-hashes -r requirements-story.txt
      - name: Verify story contracts and every choice branch
        run: bash tools/verify_all.sh story

  player:
    name: player-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked player dependencies
        run: npm ci
      - name: Verify player tests and production build
        run: bash tools/verify_all.sh player
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

  browser:
    name: browser-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked player dependencies
        run: npm ci
      - name: Install deterministic browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify player experience and visual contract
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  required:
    name: required
    if: always()
    needs: [story, player, browser, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every blocking CI lane
        env:
          STORY_RESULT: ${{ needs.story.result }}
          PLAYER_RESULT: ${{ needs.player.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$STORY_RESULT" = success
          test "$PLAYER_RESULT" = success
          test "$BROWSER_RESULT" = success
          case "$DEPENDENCY_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
