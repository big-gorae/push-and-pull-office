age: 28
role: 브랜드마케팅팀 대리 겸 프로젝트 실무 책임자
narrative_role: main_heroine
summary: 세 공략 후보 중 하나처럼 밀당과 개별 사건이 진행되지만 결정적인 선택에서는 제외되는 위장 공략. 직접 선을 긋고 후배를 보호하며 기록을 우선한다.
