expressions:
  subjective_challenging:
    emotion: attraction
    description: 원화 생성 프로필에서만 사용하는, 도발로 오독한 표정 프리셋.
  subjective_jealous:
    emotion: jealousy
    description: 원화 생성 프로필에서만 사용하는, 질투로 오독한 표정 프리셋.
  actual_skeptical:
    emotion: disbelief
    description: 눈썹을 올리고 발언의 부적절함을 확인한다.
  actual_disgust:
    emotion: disgust
    description: 턱이 굳고 시선이 차가워지지만 자세는 무너지지 않는다.
  actual_protective:
    emotion: resolve
    description: 은솔과 서정우 사이에 서서 주변 목격자를 확인한다.
  actual_focused:
    emotion: focus
    description: 오류 범위와 복구 순서를 빠르게 정리하는 업무 집중 표정.
  actual_exhausted:
    emotion: exhaustion
    description: 혼자 남은 뒤에만 굳은 어깨와 피로가 드러난다.
