schema_version: 1
id: cha_min_kyung
display_name: 차민경
age: 28
role: 브랜드마케팅팀 대리 겸 프로젝트 실무 책임자
narrative_role: main_heroine
summary: 직접 선을 긋고 후배를 보호하지만 과거 회사의 신고 축소를 목격해 기록을 우선하는 인물.
immutable_facts:
  - 한도윤의 접근을 고난도 밀당으로 즐기지 않는다.
  - 도전적인 표정은 유혹이 아니라 불쾌함과 사실 확인이다.
  - 섹시한 외형과 피해 사이에는 인과관계가 없다.
  - 하루담 홈카페 프로젝트에서 인플루언서·크리에이터 협업의 실무 연락과 공개 일정 조율을 맡는다.
voice:
  register: 짧고 정확한 존댓말
  habits:
    - 직급과 이름을 정확히 부른다.
    - 감정이 높아질수록 목소리보다 단어가 더 정확해진다.
  forbidden:
    - 명확한 거절 뒤 장난처럼 웃어 넘기기
interaction_preferences:
  authoring_shorthand: T 성향을 떠올리되 사실과 실행 가능성을 먼저 확인하는 지원 순서로만 사용한다.
  support_order:
    - factual_clarification
    - practical_resolution
    - autonomy_return
    - concise_reassurance
  prefers:
    - 영향 범위와 근거가 분명한 설명
    - 실행 가능한 대안을 준비하되 최종 결정권을 돌려주는 제안
  resists:
    - 조치 없이 걱정하지 말라는 막연한 안심
    - 승인 없이 일을 대신 처리하고 완료 사실만 통보하는 행동
  context_overrides:
    - 문제를 수습한 뒤에는 감정과 부담을 짧고 정확하게 인정받아야 대화를 이어 갈 수 있다.
visual:
  concept_art: assets/characters/cha-min-kyung/office-default/base-cutout.png
  hud_portrait: assets/hud/cha-min-kyung-avatar.png
  palette: [burgundy, charcoal, black]
  silhouette: 169cm의 길고 균형 잡힌 체형, 각진 얼굴과 검은 단발.
  props: [얇은 노트북, 금속 볼펜, 버건디 립스틱]
expressions:
  subjective_challenging:
    emotion: attraction
    description: 원화 생성 프로필에서만 사용하는, 도발로 오독한 표정 프리셋.
  subjective_jealous:
    emotion: jealousy
    description: 원화 생성 프로필에서만 사용하는, 질투로 오독한 표정 프리셋.
  actual_skeptical:
    emotion: disbelief
    description: 눈썹을 올리고 발언의 부적절함을 확인한다.
  actual_disgust:
    emotion: disgust
    description: 턱이 굳고 시선이 차가워지지만 자세는 무너지지 않는다.
  actual_protective:
    emotion: resolve
    description: 서아와 한도윤 사이에 서서 주변 목격자를 확인한다.
  actual_focused:
    emotion: focus
    description: 오류 범위와 복구 순서를 빠르게 정리하는 업무 집중 표정.
  actual_exhausted:
    emotion: exhaustion
    description: 혼자 남은 뒤에만 굳은 어깨와 피로가 드러난다.
emotion_rules:
  - id: confrontation
    priority: 30
    conditions:
      - stat: suspicion
        op: gte
        value: 60
    emotion: anger
    behavior: document_with_witness
    default_expression: actual_disgust
  - id: guarded
    priority: 20
    conditions:
      - stat: suspicion
        op: gte
        value: 30
    emotion: disgust
    behavior: set_explicit_boundary
    default_expression: actual_skeptical
  - id: baseline
    priority: 0
    conditions: []
    emotion: professional
    behavior: work_only
    default_expression: actual_skeptical
reporting_rules:
  - id: documented_report
    conditions:
      - stat: evidence_count
        op: gte
        value: 3
      - stat: dislike
        op: gte
        value: 60
    action: internal_report
relationships:
  han_do_yoon: 업무 관계를 유지하되 사적 접근은 명확히 거절한다.
  yoon_seo_a: 이상 징후를 발견한 뒤 단둘이 남지 않도록 돕는다.
  kang_yoo_jin: 빠른 신고를 지지하지만 회사의 반격 가능성을 경고한다.
