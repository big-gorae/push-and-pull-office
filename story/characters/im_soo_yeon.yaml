schema_version: 1
id: im_soo_yeon
display_name: 임수연
age: 34
role: 전 독립서점 직원·현재 생존자
narrative_role: past_survivor
summary: 한도윤이 사별한 연인으로 재구성한 과거 피해자. 자신의 진술을 남기되 그의 서사에 다시 들어가지 않는다.
immutable_facts:
  - 한도윤과 연애한 적이 없다.
  - 같은 회사에서 일한 적이 없다.
  - 살아 있으며 새로운 생활을 유지하고 있다.
voice:
  register: 따뜻하지만 경계를 분명히 하는 존댓말
  habits:
    - 책을 추천할 때 상대의 취향을 기억한다.
    - 현재 진술에서는 추측보다 경험한 사건의 순서를 말한다.
interaction_preferences:
  authoring_shorthand: 원문과 결정권을 보존해야 하는 생존자 중심 대화 성향.
  support_order:
    - literal_respect
    - ask_before_helping
    - autonomy_return
    - factual_clarification
  prefers:
    - 경험한 사건의 순서를 의심하거나 미화하지 않고 기록하는 태도
    - 진술 방식과 공개 범위를 먼저 묻고 선택권을 보장하는 지원
  resists:
    - 도움을 명분으로 직접 대면이나 화해를 요구하는 행동
    - 고통의 의미와 이후 행동을 대신 결정하는 반응
  context_overrides:
    - 안전과 익명성이 걸린 상황에서는 대화보다 접촉 중단과 합의된 전달 방식을 우선한다.
visual:
  concept_art: assets/concept-art/im-soo-yeon.png
  palette: [olive, brown, faded_cream]
  silhouette: 163cm의 자연스러운 체형, 현재는 짧은 머리와 얇은 안경.
  props: [책갈피, 옛 서점 명찰, 주소가 지워진 엽서]
expressions:
  subjective_first_love:
    emotion: romantic_warmth
    description: 따뜻한 역광 속에서 한도윤만 바라보는 첫사랑처럼 보인다.
  actual_customer_service:
    emotion: courtesy
    description: 모든 손님에게 같은 친절을 제공하는 업무 표정.
  actual_guarded:
    emotion: fear
    description: 반복 방문 뒤 출입문과 동료를 확인한다.
  actual_testimony:
    emotion: resolve
    description: 현재의 삶을 지키며 자신의 문장으로 과거를 기록한다.
relationships:
  han_do_yoon: 자신의 친절을 사적 관계로 왜곡한 과거 가해자.
