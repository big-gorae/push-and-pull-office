schema_version: 1
id: kang_yoo_jin
display_name: 강유진
age: 29
role: 브랜드마케팅팀 경력직 대리
narrative_role: supporting_witness_candidate
summary: 스토리 모드에서 반복 등장하지만 공략할 수 없으며, 사실관계를 확인하고 이상 징후를 알아차리는 조연. 기본 결말의 해결사나 구원자는 아니며 생존 모드의 세부 역할은 미확정이다.
immutable_facts:
  - 스토리 모드와 속마음 모드에 반복 등장하지만 공략 루트는 없다.
  - 스토리 모드의 기본 결말에서 증거를 완성하거나 피해자를 구조해 파국을 막는 해결사로 등장하지 않는다.
  - 생존 모드 안에서의 플레이어·조력자·조연 역할은 후속 검토한다.
  - 한도윤을 특별한 연애 상대가 아니라 중단시켜야 할 반복 행동의 주체로 본다.
  - 신고가 묵살되어도 자신의 거절이 잘못이었다고 생각하지 않는다.
voice:
  register: 사실관계 중심의 단정한 존댓말
  habits:
    - 날짜, 장소, 참석자를 포함해 말한다.
    - 했습니다와 하지 않았습니다를 사용한다.
    - 왜곡된 해석에 같은 원문을 반복한다.
interaction_preferences:
  authoring_shorthand: 사실 확인과 원문 존중을 최우선으로 하는 성향.
  support_order:
    - factual_clarification
    - literal_respect
    - autonomy_return
  prefers:
    - 날짜, 출처, 참석자를 확인한 정확한 정정
    - 합의한 다음 절차와 담당자를 분명히 하는 대화
  resists:
    - 명시적인 말을 감정 추측으로 다시 해석하는 반응
    - 거절을 친밀감이나 도전으로 바꾸어 설명하는 반응
  context_overrides:
    - 안전이 걸린 상황에서는 감정 설명보다 기록과 공식 절차를 먼저 실행한다.
visual:
  concept_art: assets/characters/kang-yoo-jin/office-default/base-cutout.png
  palette: [cobalt, emerald, light_gray]
  silhouette: 164cm의 활동적인 체형, 높은 포니테일과 똑바른 자세.
  props: [태블릿, 스타일러스, 코발트색 사원증 줄]
expressions:
  subjective_bold_flirt:
    layer: perceived
    emotion: attraction
    description: 자신과 대등하게 맞서는 당돌한 호감처럼 보인다.
  actual_fact_check:
    layer: reality
    emotion: skepticism
    description: 한쪽 눈썹을 올리고 사실관계 오류를 짚는다.
  actual_warning:
    layer: reality
    emotion: resolve
    description: 정면을 보고 경고 문장을 분명하게 전달한다.
  actual_procedural:
    layer: reality
    emotion: focus
    description: 감정 표현보다 기록과 접수 절차에 집중한다.
  actual_worn_down:
    layer: reality
    emotion: exhaustion
    description: 자신감은 남아 있지만 반복된 묵살로 표정이 지쳐 있다.
emotion_rules:
  - id: formal_action
    priority: 30
    conditions:
      - stat: suspicion
        op: gte
        value: 45
    emotion: resolve
    behavior: record_and_report
    default_expression: actual_warning
  - id: observe
    priority: 0
    conditions: []
    emotion: skeptical
    behavior: fact_check
    default_expression: actual_fact_check
reporting_rules:
  - id: immediate_record
    conditions:
      - stat: evidence_count
        op: gte
        value: 1
    action: formal_record
relationships:
  han_do_yoon: 연애적 의미를 부여하지 않고 신고 대상으로 본다.
  yoon_seo_a: 진술을 재촉하지 않고 스스로 말할 때까지 기다린다.
  cha_min_kyung: 대응 속도를 두고 충돌하지만 조직 경험을 인정한다.
