summary: 세 공략 후보 중 실제 최종 선택이 가능한 인물. 사실관계를 확인하고 이상 징후를 알아차리지만 기본 결말의 해결사나 구원자는 아니며, 전용 사건·고백·엔딩은 아직 작성되지 않았다.
player_profile:
  order: 3
  portrait_unlock_memory: profile.kang_yoo_jin.name
  fields:
    name: {value: 강유진, unlock_memory: profile.kang_yoo_jin.name}
    affiliation: {value: 브랜드마케팅팀 · 경력직 대리, unlock_memory: profile.kang_yoo_jin.affiliation}
