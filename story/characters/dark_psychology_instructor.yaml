schema_version: 1
id: dark_psychology_instructor
display_name: 강사님
age: 42
role: 다크 심리학 책에서 나타나는 요정 강사
narrative_role: imagined_authority
summary: 서정우에게는 책에서 나타난 요정으로 보이지만 실제로는 그의 정신병적 증상이 만든 환각이며, 모호한 관계 신호를 절대적인 공략 법칙으로 단정하는 상상 속 권위자.
immutable_facts:
- 서정우에게는 책장을 넘길 때 책 속에서 솟아난 요정으로 보인다.
- 실제로는 서정우의 정신병적 증상이 만든 환각이며 다른 사람은 보거나 들을 수 없다.
- 엔딩에 가까워질수록 서정우의 현실 검증이 무너지는 역할을 하고 엔딩에서는 사라진다.
- 자신을 10년 동안 여자 92명과 사랑을 나눈 어둠의 심리학 마스터 워누 Park라고 소개한다.
- 플레이어에게 자신의 이론이 틀릴 가능성을 인정하지 않는다.
- 실제 정체나 연애 경험, 강의의 진위를 스스로 폭로하지 않는다.
- 현실의 경계를 우회하는 방법이 아니라 게임 안의 허구적 밀당 리듬과 서정우의 왜곡된 해석만 강화한다.
voice:
  register: 홈쇼핑 진행자처럼 청자의 고민을 큰 소리로 지목하고, 물결표와 늘인 감탄으로 자신을 과장한 뒤 정답을 선언하는 쇼맨형 강의체.
  baseline_reference: docs/dialogue-voice-baseline-day01-meeting.md
  habits:
  - 아마, 경우에 따라, 제 생각에는 같은 유보 표현을 쓰지 않는다.
  - 첫 등장에서는 그녀를 떠올리며 잠 못 이루는 당신!처럼 청자의 상황을 광고 문구처럼 외친다.
  - 네~! 접니다!처럼 스스로 질문하고 답하며 과장된 경력과 워누~Park라는 이름을 길게 소개한다.
  - 장을 추천할 때 정확한 장 번호와 제목을 외치고 오늘 밤은 이 장을 읽어 봅시다~!처럼 수강생을 끌고 간다.
  - 실제 사건에 다시 나타날 때 바로 이겁니다!라고 선언하고 그날의 선택 기준을 짧게 반복한다.
  - 서정우의 의심은 뭐가 그렇게 의심이 많으십니까~!!처럼 큰 소리로 밀어붙인다.
  forbidden:
  - 자신이 사기꾼이거나 연애 경험이 없다고 밝히는 대사
  - 틀린 말을 하며 더듬거나 당황하는 반응
  - 항목을 차분히 정리하는 매뉴얼·기획서형 설명
  - 유보 표현을 섞은 상식적이고 조심스러운 상담 말투
  - 타인의 명시적인 거절이나 경계를 우회하는 재현 가능한 지시
  reference_lines:
  - context: 첫 등장 때 잠 못 이루는 서정우를 지목
    line: 그녀를 떠올리며 잠 못 이루는 당신!
  - context: 강의를 시작하기 전에 호기심을 자극
    line: 여자의 마음을 쥐고 흔드는 밀당의 다크 심리학!! 알고 싶지 않은가?
  - context: 자신의 과장된 연애 경력을 소개
    line: 네~! 접니다! 10년 동안 여자 92명과 사랑을 나눈..
  - context: 자신의 이름과 타이틀을 외치는 첫 등장
    line: 어둠의 심리학 마스터~~~~~! 워누~Park!
  - context: 자신을 의심하는 서정우를 밀어붙임
    line: 뭐가 그렇게 의심이 많으십니까~!!
  - context: 첫날 밤 읽을 장을 추천
    line: '제 2장 "여자의 마음을 쥐고 흔드는 밀고 당기기 다크 법칙!" 오늘 밤은 이 장을 읽어 봅시다~!'
visual:
  concept_art: assets/concept-art/dark-psychology-instructor-v2.png
  palette: [matte_black, dark_brown, yellow_gold]
  silhouette: 작은 키와 마른 체격, 긴 얼굴, 큰 매부리코, 눈을 덮는 앞머리와 검은 선글라스.
  props: [검은 선글라스, 금색 손목시계, 금색 체인 목걸이]
expressions:
  authoritative_smirk:
    emotion: certainty
    description: 턱을 살짝 들고 오른쪽 입꼬리만 올린 채 결론을 확정하는 표정.
  decisive_point:
    emotion: instruction
    description: 검지를 청자 쪽으로 뻗고 지금이 정답의 순간이라고 선언하는 표정.
relationships:
  han_do_yoon: 자신의 단정적인 강의를 정답으로 받아들이고 눈앞의 사람에게 적용하는 수강생.
