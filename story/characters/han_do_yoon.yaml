schema_version: 1
id: han_do_yoon
display_name: 한도윤
age: 42
role: 영업기획팀 과장
narrative_role: unreliable_protagonist
summary: 타인의 거절과 경계를 밀당으로 번역해 자신의 연애 서사를 유지하는 주인공.
immutable_facts:
  - 임수연과 실제로 연애한 적이 없다.
  - 불리한 사실을 완전히 잊은 것이 아니라 의미와 순서를 바꿔 기억한다.
  - 외모가 아니라 반복적인 경계 침범과 권력 사용이 공포의 원인이다.
voice:
  register: 평범한 직장인 존댓말. 실제 발화는 자연스럽고 짧게, 혼잣말은 일상물 만화 주인공처럼 감탄과 자기 태클이 빠르게 이어진다.
  baseline_reference: docs/dialogue-voice-baseline-day01-meeting.md
  habits:
    - 업무 대화에서는 상대의 직급과 상황에 맞춰 평범하고 부드럽게 말한다.
    - 당황하면 앗, 이런, 에엣 같은 짧은 감탄 뒤 스스로 상황을 수습한다.
    - 혼잣말에서는 외모나 친절에 쉽게 감탄한 뒤 곧바로 정신 차리자며 자기 생각에 태클을 건다.
    - 상대의 행동을 관찰하고 과장되게 반응하지만 초반부터 자신을 좋아한다고 단정하지 않는다.
  forbidden:
    - 노인처럼 고루하거나 장황한 훈계조 말투
    - 모든 친절을 연애 감정으로 즉시 확신하는 독백
    - 업무 흐름을 끊을 정도로 같은 착각을 반복하기
    - 자신의 행동을 스토킹이라고 자발적으로 정확히 명명하기
  reference_lines:
    - context: 수정 자료를 건네받았을 때의 실제 발화
      line: 그래도 돼요? 고마워요, 서아 씨!
    - context: 서아의 도움을 받은 직후의 혼잣말
      line: (서아 씨 덕분에 살았다! 마음씨까지 다정하잖아!)
    - context: 민경의 정확한 지적을 들은 직후의 혼잣말
      line: (틀린 말은 하나도 없는데, 왜 이렇게 데미지가 크지?)
    - context: 첫 회의를 마친 뒤의 결심
      line: (좋아! 이번 프로젝트는 반드시 성공시킨다!)
visual:
  concept_art: assets/concept-art/han-do-yoon.png
  palette: [charcoal, muted_navy, wine]
  subjective: 키가 크고 날렵하며 여유 있는 중년 미남으로 인식한다.
  reality: 166cm의 무거운 체형, 자기관리가 부족하고 상대 쪽으로 상체를 기울인다.
expressions:
  subjective_confident:
    emotion: confidence
    description: 원화 생성 프로필에서만 사용하는, 넉넉하고 다정하다고 믿는 미소 프리셋.
  actual_waiting_smile:
    emotion: control
    description: 상대가 원하는 반응을 할 때까지 사라지지 않는 미소.
  subjective_wounded:
    emotion: romantic_pain
    description: 원화 생성 프로필에서만 사용하는, 사랑 때문에 상처받았다고 여기는 표정 프리셋.
  actual_irritated:
    emotion: irritation
    description: 거절을 자신의 권리에 대한 모욕으로 받아들인 표정.
relationships:
  yoon_seo_a: 보호해야 할 수줍은 연하라고 규정한다.
  cha_min_kyung: 자신과 대등하게 긴장감을 즐기는 상대로 규정한다.
  kang_yoo_jin: 자신의 매력을 시험하는 최종 난관으로 규정한다.
  im_soo_yeon: 세상이 빼앗아 간 첫사랑으로 재구성한다.
