schema_version: 1
id: han_do_yoon
display_name: 한도윤
age: 42
role: 영업기획팀 과장
narrative_role: unreliable_protagonist
summary: 타인의 거절과 경계를 밀당으로 번역해 자신의 연애 서사를 유지하는 주인공.
immutable_facts:
- 임수연과 실제로 연애한 적이 없다.
- 젊은 시절에는 실제로 수려한 외모였지만 현재는 기존 원화보다 훨씬 더 추하고 불쾌한 인상의 중년 남성이다.
- 가족의 맹목적인 사랑과 반복적인 외모 칭찬, 다크 심리학의 말을 자기 확신의 근거로 삼는다.
- 불리한 사실을 완전히 잊은 것이 아니라 타인의 말과 행동의 의미와 순서를 선택적으로 바꿔 기억한다.
- 관계망상과 현실 검증 저하를 포함한 정신병적 증상이 있으며, 외부의 강화와 자신의 선택적 기억 왜곡이 함께 작동한다.
- 정신병적 증상과 주변의 강화는 그의 인지 구조를 설명하지만 타인에게 가한 행동의 책임을 없애지 않는다.
voice:
  register: 평범한 직장인 존댓말. 실제 발화는 자연스럽고 짧게, 혼잣말은 순수한 일본 애니메이션 소년 주인공처럼 구체적인 감탄과 순진한 상상이 빠르게 이어진다.
  baseline_reference: docs/dialogue-voice-baseline-day01-meeting.md
  habits:
  - 업무 대화에서는 상대의 직급과 상황에 맞춰 평범하고 부드럽게 말한다.
  - 당황하면 앗, 이런, 에엣 같은 짧은 감탄 뒤 스스로 상황을 수습한다.
  - 혼잣말에서는 외모나 친절에 쉽게 감탄한 뒤 곧바로 정신 차리자며 자기 생각에 태클을 건다.
  - 집에 혼자 있는 밤에는 혼잣말을 실제로 소리 내므로 괄호를 쓰지 않는다.
  - 밤에 그날 만난 여성을 떠올릴 때는 외모의 구체적인 인상, 과장된 비교, 함께 있거나 만져 보는 순진한 상상을 여러 줄에 걸쳐 자세히 말한다.
  - 한 가지 인상만 보고도 상대가 사랑받은 성장기와 학창 시절의 인기, 존재를 확인하지 않은 남자친구의 행복까지 멋대로 상상하며 감정을 키운다.
  - 감정이 커지면 맨날 맨날 같은 유아적인 반복, 짧게 끊긴 감탄과 연속된 느낌표로 부러움이나 질투를 터뜨린다.
  - 상대의 행동을 관찰하고 과장되게 반응하지만 초반부터 자신을 좋아한다고 단정하지 않는다.
  forbidden:
  - 노인처럼 고루하거나 장황한 훈계조 말투
  - 모든 친절을 연애 감정으로 즉시 확신하는 독백
  - 업무 흐름을 끊을 정도로 같은 착각을 반복하기
  - 자신의 행동을 스토킹이라고 자발적으로 정확히 명명하기
  reference_lines:
  - context: 수정 자료를 건네받았을 때의 실제 발화
    line: 그래도 돼요? 고마워요, 서아 씨!
  - context: 서아의 도움을 받은 직후의 혼잣말
    line: (서아 씨 덕분에 살았다! 마음씨까지 다정하잖아!)
  - context: 민경의 정확한 지적을 들은 직후의 혼잣말
    line: (틀린 말은 하나도 없는데, 왜 이렇게 데미지가 크지?)
  - context: 첫날 밤 강유진이 사랑받고 자랐을 것이라고 상상하는 실제 혼잣말
    line: 분명 가족들에게 무한한 사랑을 받고 자랐겠지?
  - context: 첫날 밤 윤서아의 웃는 얼굴을 떠올리는 실제 혼잣말
    line: 서아씨는 웃는 모습이 정말 귀여웠어...
  - context: 첫날 밤 윤서아의 눈과 머리카락을 떠올리는 실제 혼잣말
    line: 그렇게까지 아름다운 갈색 눈 머리카락은 처음 봤어
  - context: 첫날 밤 차민경과 함께 걷는 모습을 상상하는 실제 혼잣말
    line: 저런 여자와 함께 길을 걸으면 어떤 느낌일까?
  - context: 첫날 밤 강유진의 존재를 확인하지 않은 남자친구를 부러워하는 실제 혼잣말
    line: 나쁜 놈.. 부럽다..!!!
visual:
  concept_art: assets/concept-art/han-do-yoon.png
  palette: [charcoal, muted_navy, wine]
  subjective: 키가 크고 날렵하며 여유 있는 중년 미남으로 인식한다.
  past_reality: 젊은 시절에는 균형 잡힌 이목구비와 풍성한 머리, 단정한 체형을 지닌 수려한 외모였다.
  reality: 166cm의 비대하고 무거운 체형. 심하게 무너진 얼굴 비율, 성긴 머리숱, 거칠고 번들거리는 피부, 불결한 수염과 누렇게 상한 치아가 두드러지는 매우 추한 현재 모습이며 상대 쪽으로 상체를 기울인다. 기존 원화는 이 기준보다 미화된 임시 자산이다.
expressions:
  subjective_confident:
    emotion: confidence
    description: 원화 생성 프로필에서만 사용하는, 넉넉하고 다정하다고 믿는 미소 프리셋.
  actual_waiting_smile:
    emotion: control
    description: 상대가 원하는 반응을 할 때까지 사라지지 않는 미소.
  actual_irritated:
    emotion: irritation
    description: 거절을 자신의 권리에 대한 모욕으로 받아들인 표정.
  subjective_wounded:
    emotion: romantic_pain
    description: 원화 생성 프로필에서만 사용하는, 사랑 때문에 상처받았다고 여기는 표정 프리셋.
relationships:
  yoon_seo_a: 보호해야 할 수줍은 연하라고 규정한다.
  cha_min_kyung: 자신과 대등하게 긴장감을 즐기는 상대로 규정한다.
  kang_yoo_jin: 자신의 매력을 시험하는 최종 난관으로 규정한다.
  im_soo_yeon: 세상이 빼앗아 간 첫사랑으로 재구성한다.
