schema_version: 1
id: yoon_seo_a
display_name: 윤서아
age: 24
role: 영업기획팀 계약직 사원
narrative_role: main_heroine
summary: 갈등 상황에서 얼어붙지만 안전한 관계에서는 유머가 많고 기획자로서의 꿈이 뚜렷한 인물.
player_profile:
  order: 1
  portrait_unlock_memory: profile.yoon_seo_a.name
  fields:
    name: {value: 윤서아, unlock_memory: profile.yoon_seo_a.name}
    affiliation: {value: 영업기획팀 · 계약직 사원, unlock_memory: profile.yoon_seo_a.affiliation}
    mbti: {value: INFP, unlock_memory: profile.yoon_seo_a.mbti}
    hobby: {value: 고양이 문구 수집 · 전국 고양이 카페 탐방, unlock_memory: profile.yoon_seo_a.hobby}
    likes: {value: 말차 디저트 · 예쁜 문구 · 퇴근 후 산책, unlock_memory: profile.yoon_seo_a.likes}
    ideal_type: {value: 곰같은 사람 · 다정한 사람, unlock_memory: profile.yoon_seo_a.ideal_type}
    residence: {value: 회사 근처 오피스텔 · 기존 입주민, unlock_memory: profile.yoon_seo_a.residence}
    tmi: {value: 텀블러의 고양이 스티커를 계절마다 바꾼다., unlock_memory: profile.yoon_seo_a.tmi}
immutable_facts:
  - 한도윤에게 연애 감정을 느끼지 않는다.
  - 사회적 미소와 짧은 대답은 동결 반응이지 호감 신호가 아니다.
  - 의심도가 내려가도 이미 누적된 비호감은 쉽게 사라지지 않는다.
voice:
  register: 조심스러운 존댓말
  habits:
    - 문장 앞에 아 또는 저기를 붙인다.
    - 긴장하면 필요 이상으로 일정과 이유를 설명한다.
  safe_context: 동료 앞에서는 말이 빨라지고 장난이 많아진다.
interaction_preferences:
  authoring_shorthand: F 성향을 떠올리되 감정 인정부터 시작하는 지원 순서로만 사용한다.
  support_order:
    - emotional_validation
    - ask_before_helping
    - autonomy_return
    - practical_resolution
  prefers:
    - 놀람이나 부담을 먼저 구체적으로 알아차리는 말
    - 어떤 도움이 필요한지 묻고 거절할 여지를 주는 제안
  resists:
    - 별일 아니라며 감정을 축소하는 안심
    - 동의를 묻지 않고 업무나 결정을 대신 처리하는 해결책
  context_overrides:
    - 마감이 임박했거나 피해가 커지는 중이면 복구 행동을 먼저 요청할 수 있다.
visual:
  concept_art: assets/characters/yoon-seo-a/office-default/base-cutout.png
  hud_portrait: assets/hud/yoon-seo-a-avatar.png
  palette: [ivory, pale_blue, navy]
  silhouette: 160cm의 작고 가벼운 성인 체형, 긴 흑갈색 머리와 부드러운 눈매.
  props: [고양이 스티커 수첩, 휴대전화, 텀블러]
expressions:
  subjective_shy:
    emotion: romantic_shyness
    description: 원화 생성 프로필에서만 사용하는, 수줍은 호감으로 오독한 표정 프리셋.
  subjective_relieved_smile:
    emotion: attraction
    description: 원화 생성 프로필에서만 사용하는, 다시 다가오는 미소로 오독한 표정 프리셋.
  actual_social_smile:
    emotion: appeasement
    description: 갈등을 빨리 끝내기 위한 얇고 짧은 미소.
  actual_tense:
    emotion: fear
    description: 어깨가 올라가고 시선이 출입문과 휴대전화를 확인한다.
  actual_relief:
    emotion: relief
    description: 접근이 멈춘 뒤 호흡과 어깨가 잠시 풀린다.
  actual_flustered:
    emotion: embarrassment
    description: 발표 자료 오류를 알아차리고 호흡이 짧아졌지만 자리를 피하지는 않는 표정.
  actual_grateful:
    emotion: gratitude
    description: 발표를 다시 이어 가게 도와준 동료에게 실제 고마움을 보이는 편안한 미소.
  actual_exhausted:
    emotion: exhaustion
    description: 수면 부족과 반복되는 주변 확인으로 눈빛이 흐려진다.
emotion_rules:
  - id: high_fear
    priority: 30
    conditions:
      - stat: suspicion
        op: gte
        value: 65
    emotion: fear
    behavior: seeks_witness
    default_expression: actual_tense
  - id: self_doubt
    priority: 20
    conditions:
      - stat: suspicion
        op: gte
        value: 20
    emotion: anxiety
    behavior: avoids_being_alone
    default_expression: actual_social_smile
  - id: baseline
    priority: 0
    conditions: []
    emotion: cautious
    behavior: work_normally
    default_expression: actual_social_smile
reporting_rules:
  - id: supported_report
    conditions:
      - stat: evidence_count
        op: gte
        value: 3
      - stat: dislike
        op: gte
        value: 70
    action: seek_support_then_report
relationships:
  han_do_yoon: 평가권을 가진 상사라 직접 대립하기 어렵다.
  cha_min_kyung: 존경하는 선배지만 폐를 끼칠까 봐 처음에는 숨긴다.
  kang_yoo_jin: 단호함을 부러워하면서 자신과 비교해 움츠러든다.
