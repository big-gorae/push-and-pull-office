schema_version: 1
id: unlocks
mode_labels:
  base: 스토리 모드
  truth_view: 원문 모드
  survivor_view: 생존 모드
unlock_rules:
  - id: revelation_after_seo_a
    mode: truth_view
    reward: 실제 표정, 속마음과 보이지 않는 사건을 같은 타임라인에 표시한다.
    conditions:
      - {path: progress.cleared_routes, op: contains, value: seo_a}
  - id: revelation_after_min_kyung
    mode: truth_view
    reward: 실제 표정, 속마음과 보이지 않는 사건을 같은 타임라인에 표시한다.
    conditions:
      - {path: progress.cleared_routes, op: contains, value: min_kyung}
  - id: survival_after_seo_a
    mode: survivor_view
    reward: 첫 번째 루트 클리어 보상으로 평행세계의 피해자 시점에서 증거를 모으고 살아남는 생존 모드를 연다.
    conditions:
      - {path: progress.cleared_routes, op: contains, value: seo_a}
  - id: survival_after_min_kyung
    mode: survivor_view
    reward: 첫 번째 루트 클리어 보상으로 평행세계의 피해자 시점에서 증거를 모으고 살아남는 생존 모드를 연다.
    conditions:
      - {path: progress.cleared_routes, op: contains, value: min_kyung}
mode_teasers:
  - id: after_first_clear
    conditions:
      - {path: progress.unlocked_modes, op: contains, value: survivor_view}
    reveals:
      - mode: survivor_view
        title: 생존 모드
        teaser: 그의 애정과 분노 사이를 읽으며, 증거를 모으고 살아남으십시오.

survival_mode:
  id: survivor_view
  status: confirmed
  unlock: any_base_route_ending
  playable_character:
    status: undecided
  objective: 지속적으로 공격적인 한도윤을 최대한 자극하지 않으면서, 그가 스스로 남기는 물리적 증거를 보존·연결하고 살아남는다.
  continuity:
    type: parallel_world
    reference_campaign: main
    shares_starting_premise: true
    may_reuse_date_motifs: true
    same_core_events_required: false
    preserve_base_outcome: true
    acts_as_base_truth_view: false
  antagonist_stance:
    starts_aggressive: true
    remains_aggressive: true
    player_induced: false
  player_strategy:
    primary_tension: minimize_provocation_while_preserving_physical_evidence
    direct_violence_baiting_allowed: false
  danger_axis:
    visible: false
    left: retaliation
    center: controllable_distance
    right: fixation
    player_reads: [contact_frequency, wording, distance_changes, work_interference]
  evidence:
    primary: physical
    inventory_visible: true
    sufficiency_threshold_visible: false
    qualities: [chronology, credibility, backup, corroboration]
  endings:
    - id: retaliation_catastrophe
      rank: failure
      condition: retaliation_extreme
      outcome: 보복 위험이 임계를 넘어 사망 또는 회복 불가능한 파국에 이른다.
    - id: fixation_catastrophe
      rank: failure
      condition: fixation_extreme
      outcome: 집착과 추적이 일상을 침범해 사망 또는 회복 불가능한 파국에 이른다.
    - id: unfinished_escape
      rank: partial_failure
      condition: balanced_but_insufficient_evidence
      outcome: 당장은 살아남지만 입증에 실패해 위험이 계속된다.
    - id: costly_survival
      rank: partial_success
      condition: sufficient_evidence_without_support
      outcome: 증거를 지키지만 직장·거주지·관계망 중 중요한 것을 잃고 벗어난다.
    - id: truth_and_survival
      rank: best
      condition: evidence_connection_and_timing_aligned
      outcome: 증거와 증언을 연결해 신체적 안전과 공적 기록을 모두 확보한다.
  responsibility_rule: 피해자의 선택은 폭력의 원인이 아니며 가해자의 폭력 책임을 감소시키지 않는다.
