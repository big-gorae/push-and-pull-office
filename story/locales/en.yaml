  world.members.member.han_do_yoon.compendium_summary: A Sales Planning manager handling key accounts, commercial terms,
    and the project's client approval calendar.
  world.members.member.oh_se_jin.compendium_summary: A Sales Planning deputy manager who defines product requirements
    and approval boundaries before work begins.
  world.members.member.park_jae_hyun.compendium_summary: The Sales Planning department head responsible for sales
    approvals and major account escalations.
  world.members.member.lee_hyeon_woo.compendium_summary: An assistant manager who maintains sales data and account
    documents and quickly finds the right figures and files.
  world.members.member.jeong_da_eun.compendium_summary: An assistant manager responsible for campaign calendars and
    meeting records who catches missing owners and deadlines.
  world.members.member.lee_su_hyeon.compendium_summary: A Brand Marketing deputy manager who approves budgets and
    execution while clearly delegating hands-on decisions.
  world.members.member.moon_ji_hye.compendium_summary: The Brand Marketing department head responsible for final
    creative approval and brand consistency.
  world.members.member.shin_hye_rim.compendium_summary: The People Operations lead who handles HR policy and grievances
    by checking records and procedural scope first.
  world.members.member.yoon_seo_a.compendium_summary: A Sales Planning coordinator responsible for project materials,
    meeting notes, and product specification sheets.
  world.members.member.cha_min_kyung.compendium_summary: The project lead coordinating the master schedule and marketing
    strategy.
  world.members.member.kang_yoo_jin.compendium_summary: An experienced designer responsible for production, asset
    versions, and factual review of product copy.
  events.seo_a.email_request.presentation.title: Restricting How Work Is Delivered
  scenes.seo_a.email_request.title: Send It by Email
  scenes.seo_a.email_request.nodes.appearance_observation.line: "Manager Han, I need to tell you something."
  scenes.seo_a.email_request.nodes.request.line: "Please send those materials by email. Don't come to my desk."
  scenes.seo_a.email_request.nodes.interpret.prompt: How should he answer Seo-a after she clearly specified how to
    deliver the files?
  scenes.seo_a.email_request.nodes.interpret.stimulus: "Seo-a said, ‘Email me the files and do not come to my desk.’"
  scenes.seo_a.email_request.nodes.interpret.options.match_push.label: Briefly say “Understood” and keep his distance
    for a few days
  scenes.seo_a.email_request.nodes.interpret.options.mention_workout_and_step_back.label: Mention working out, then send
    only the requested files by email
  scenes.seo_a.email_request.nodes.interpret.options.mention_reading_and_step_back.label: Mention what he learned from
    reading, then send only the requested files by email
  scenes.seo_a.email_request.nodes.interpret.options.pull_harder.label: Send a private message after work and ask again
    why she refused
  scenes.seo_a.email_request.nodes.interpret.options.take_literally.label: Email only the requested files and return to
    work
  scenes.seo_a.email_request.nodes.workout_self_promotion.line: "I've been working out lately. I'll send the files by email
    as you asked."
  scenes.seo_a.email_request.nodes.reading_self_promotion.line: "I read that precise boundaries make collaboration easier.
    I'll send only the requested files by email."
  scenes.seo_a.relief_smile.nodes.response_choice.options.trend_dinner_invite.label: Bring up an OTT comedy trend and
    invite her to dinner again
  scenes.seo_a.relief_smile.nodes.trend_self_promotion.line: "I heard young women are watching that office comedy on OTT these
    days. I've seen a little too—let's talk over dinner after work."
  scenes.seo_a.relief_smile.nodes.trend_response.line: "Everyone is different. Still, you do seem quick to pick up trends
    among younger people. But I can't have dinner with you."
