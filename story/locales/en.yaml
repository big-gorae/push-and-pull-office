  events.seo_a.email_request.presentation.perceived.title: Seo-a Tests the Distance at Lunch
  events.seo_a.email_request.presentation.reality.title: Restricting How Work Is Delivered
  scenes.seo_a.email_request.title: Send It by Email
  scenes.seo_a.email_request.nodes.appearance_observation.variants.noticed_change.perceived.line: "Oh, I think you've lost a little weight lately."
  scenes.seo_a.email_request.nodes.appearance_observation.variants.noticed_change.reality.line: "Oh, I think you've lost a little weight lately."
  scenes.seo_a.email_request.nodes.appearance_observation.variants.default.perceived.line: "Manager Han, I need to tell you something."
  scenes.seo_a.email_request.nodes.appearance_observation.variants.default.reality.line: "Manager Han, I need to tell you something."
  scenes.seo_a.email_request.nodes.appearance_observation_inner.variants.noticed_change.perceived.line: (She must have kept watching me to notice first. The workouts paid off.)
  scenes.seo_a.email_request.nodes.appearance_observation_inner.variants.noticed_change.reality.line: (I only mentioned the visible change as a greeting. Now I need to discuss how he sends the files.)
  scenes.seo_a.email_request.nodes.appearance_observation_inner.variants.default.perceived.line: (She must be curious about my reaction if she called me aside.)
  scenes.seo_a.email_request.nodes.appearance_observation_inner.variants.default.reality.line: (This time I need to clearly tell him not to come to my desk.)
  scenes.seo_a.email_request.nodes.request.perceived.line: "Please send those materials by email. Don't come to my desk."
  scenes.seo_a.email_request.nodes.request.reality.line: "Please send those materials by email. Don't come to my desk."
  scenes.seo_a.email_request.nodes.request_inner.perceived.line: (Does she regret losing an excuse for me to visit? Looking away like that is cute.)
  scenes.seo_a.email_request.nodes.request_inner.reality.line: (If he comes to my desk again, I need to tell Min-kyung.)
  scenes.seo_a.email_request.nodes.interpret.prompt: How should he answer Seo-a after she clearly specified how to deliver the files?
  scenes.seo_a.email_request.nodes.interpret.stimulus: "Seo-a said, ‘Email me the files and do not come to my desk.’"
  scenes.seo_a.email_request.nodes.interpret.options.match_push.label: Briefly say “Understood” and keep his distance for a few days
  scenes.seo_a.email_request.nodes.interpret.options.mention_workout_and_step_back.label: Mention working out, then send only the requested files by email
  scenes.seo_a.email_request.nodes.interpret.options.pull_harder.label: Send a private message after work and ask again why she refused
  scenes.seo_a.email_request.nodes.interpret.options.take_literally.label: Email only the requested files and return to work
  scenes.seo_a.email_request.nodes.workout_self_promotion.perceived.line: "I've been working out lately. I'll send the files by email as you asked."
  scenes.seo_a.email_request.nodes.workout_self_promotion.reality.line: "I've been working out lately. I'll send the files by email as you asked."
  scenes.seo_a.relief_smile.nodes.response_choice.options.trend_dinner_invite.label: Bring up short-video trends and invite her to dinner again
  scenes.seo_a.relief_smile.nodes.trend_self_promotion.perceived.line: "I heard young women watch short review clips first these days. I've seen a few too—let's talk over dinner after work."
  scenes.seo_a.relief_smile.nodes.trend_self_promotion.reality.line: "I heard young women watch short review clips first these days. I've seen a few too—let's talk over dinner after work."
  scenes.seo_a.relief_smile.nodes.trend_response.perceived.line: "Everyone is different. Still, you do seem quick to pick up trends among younger people. But I can't have dinner with you."
  scenes.seo_a.relief_smile.nodes.trend_response.reality.line: "Everyone is different. Still, you do seem quick to pick up trends among younger people. But I can't have dinner with you."
  scenes.seo_a.relief_smile.nodes.trend_response_inner.perceived.line: (She sees that we connect without a generation gap. Dinner is only a matter of timing.)
  scenes.seo_a.relief_smile.nodes.trend_response_inner.reality.line: (He's grouping us as “young women” again. I should make the refusal clear and leave.)
