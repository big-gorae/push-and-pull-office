  "selfDevelopment.activity.workout.description": "Build stamina and appearance at the cost of significant fatigue."
  "selfDevelopment.activity.workout.reflection.perceived": "(If I keep improving, she'll be the first to notice tomorrow.)"
  "selfDevelopment.activity.workout.reflection.reality": "Do-yoon imagined his coworkers noticing the change before thinking about the workout itself."
  "selfDevelopment.activity.grooming.title": "Clothes and skincare"
  "selfDevelopment.activity.grooming.description": "Prepare a polished impression while gaining a little fatigue."
  "selfDevelopment.activity.grooming.reflection.perceived": "(Someone is bound to notice the small differences.)"
  "selfDevelopment.activity.grooming.reflection.reality": "Do-yoon adjusted his reflection while deciding in advance how a particular coworker would react."
  "selfDevelopment.activity.ott.title": "Watch a comedy series"
  "selfDevelopment.activity.ott.description": "Gain humor and taste while resting, with a tiny loss of appeal."
  "selfDevelopment.activity.ott.reflection.perceived": "(Now I can join any conversation naturally.)"
  "selfDevelopment.activity.ott.reflection.reality": "Do-yoon replayed lines he could reuse in conversation instead of the funniest scenes."
  "selfDevelopment.activity.reels.title": "Browse reels"
  "selfDevelopment.activity.reels.description": "Pick up quick trends and recover, with a tiny loss of appeal."
  "selfDevelopment.activity.reels.reflection.perceived": "(I finally understand what younger people like.)"
  "selfDevelopment.activity.reels.reflection.reality": "Do-yoon recorded a few seconds of trend as if it proved he understood his coworkers."
  "selfDevelopment.activity.sleep.title": "Go to bed early"
  "selfDevelopment.activity.sleep.description": "Gain no stats, but recover a large amount of fatigue."
  "selfDevelopment.activity.sleep.reflection.perceived": "(Keeping my composure is part of maintaining my appeal.)"
  "selfDevelopment.activity.sleep.reflection.reality": "The phone screen went dark, leaving Do-yoon alone in the room."
