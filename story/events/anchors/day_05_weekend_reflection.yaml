presentation:
  perceived:
    title: 두 번째로 발견한 새로운 모습
    summary: 토요일에 만나지 않은 다른 한 사람과 일요일에 마주치고, 두 사람을 회사 밖에서도 조금 더 알아보고 싶다고 생각한다. 우연한 조우만으로 자신에게 관심 있다고 단정하지 않는다.
  reality:
    title: 서로 연결되지 않은 두 번의 우연
    summary: 토요일과 일요일에 서아와 민경이 한 명씩 한도윤과 마주친다. 두 사람은 각자의 조우를 평범한 우연으로 받아들이며 아직 서로의 경험을 연결하거나 한도윤을 의심하지 않는다.
