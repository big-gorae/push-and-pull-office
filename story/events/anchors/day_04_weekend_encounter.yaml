    title: 첫 번째로 이어진 운명
    summary: 현재 공략 우선 판정이 높은 한 사람과 주말 장소에서 마주치고, 작별 인사에 덧붙은 한 구절을 다시 만나고 싶다는 신호로 받아들인다.
  reality:
    title: 동료와 마주친 한 번의 우연
    summary: 토요일에는 서아와 민경 중 한 명과만 만난다. 상대는 공공장소에서 동료와 마주친 우연으로 받아들이며 아직 의도적 접근을 의심하지 않는다.
