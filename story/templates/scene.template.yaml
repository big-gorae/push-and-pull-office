schema_version: 1
id: route_id.scene_id
title: 장면 제목
route: route_id
chapter: 1
sequence: 10
location: office
time: day
purpose: 이 장면이 바꾸는 관계와 정보를 한 문장으로 작성한다.
cast: [han_do_yoon, heroine_id]
entry_conditions: []
state_contract:
  reads:
    - hidden.heroines.heroine_id.suspicion
    - progress.flags.push_pull
  writes:
    - visible.heroines.heroine_id.initiative
    - hidden.heroines.heroine_id.suspicion
    - hidden.heroines.heroine_id.dislike
    - hidden.heroines.heroine_id.evidence_count
    - progress.flags.push_pull
start_node: opening
nodes:
  - id: opening
    kind: dual_dialogue
    speaker: heroine_id
    perceived:
      atmosphere: warm_romance
      expression: subjective_expression_id
      line: "주인공이 듣거나 기억하는 대사"
    reality:
      atmosphere: cold_office
      expression: actual_expression_id
      line: "실제로 한 대사"
      intent: boundary
    next: opening_inner

  - id: opening_inner
    kind: dual_dialogue
    presentation_flags: [inner_voice]
    speakers:
      perceived: han_do_yoon
      reality: heroine_id
    perceived:
      atmosphere: warm_romance
      line: "(한도윤이 자연스럽게 떠올리는 생각.)"
    reality:
      atmosphere: cold_office
      line: "(실제 인물이 자연스럽게 떠올리는 속마음.)"
      intent: boundary
    next: choice_01

  - id: choice_01
    kind: choice
    prompt: 상대의 현재 상태를 어떻게 판단할까?
    stimulus: 상대가 방금 한 말이나 행동을 한 문장으로 요약한다.
    options:
      - id: option_id
        label: "플레이어가 보는 선택지"
        interpretation: "한도윤이 믿는 의미"
        action: "객관적으로 발생하는 행동"
        push_pull:
          # target: another_heroine_id # 루트 히로인과 다를 때만. 현재 cast의 히로인이어야 한다.
          action: approach
          intensity: 12
          base_score: 4
        # 지원 화법을 실제로 사용한 선택에만 interaction을 추가한다.
        # interaction:
        #   target: heroine_id # 실제 반응하는 현재 cast 인물
        #   support_styles: [emotional_validation, ask_before_helping]
        # 명시적인 요청·거절을 그대로 존중하는 선택이면 literal_respect를 우선한다.
        conditions: []
        effects:
          - path: hidden.heroines.heroine_id.suspicion
            op: add
            value: 5
        next: leave

  - id: leave
    kind: exit
    transitions:
      - default: true
        scene: next_scene_id
