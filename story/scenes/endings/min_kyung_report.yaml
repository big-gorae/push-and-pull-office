schema_version: 1
id: ending.min_kyung.report
title: 신랑의 얼굴
route: min_kyung
chapter: 3
sequence: 91
location: apartment_corridor
time: evening
purpose: 민경의 집을 찾아간 뒤 현장 신고와 기존 기록이 연결되고, 정식 신병 처리 후 객관 기록에서 한도윤의 실제 모습과 관계의 진실이 드러난다.
cast: [han_do_yoon, cha_min_kyung]
entry_conditions: []
state_contract:
  reads:
    - progress.cleared_routes
    - progress.memories
  writes:
    - progress.cleared_routes
    - progress.unlocked_modes
    - progress.memories
    - progress.flags.story_mode.home_incident
start_node: complete
nodes:
  - id: complete
    kind: effect
    effects:
      - {path: progress.cleared_routes, op: append_unique, value: min_kyung}
      - {path: progress.unlocked_modes, op: append_unique, value: truth_view}
      - {path: progress.unlocked_modes, op: append_unique, value: survivor_view}
      - {path: progress.flags.story_mode.home_incident, op: set, value: reported}
    next: leave_request

  - id: leave_request
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: dread
      expression: subjective_challenging
      line: "제 주소를 어떻게 알았습니까? 여기까지 찾아오지 마세요. 돌아가세요."
      protagonist_interpretation: 예상하지 못한 고백에 흔들리면서도 마지막까지 주도권을 넘기지 않으려 한다고 믿는다.
    reality:
      atmosphere: dread
      expression: actual_disgust
      line: "제 주소를 어떻게 알았습니까? 여기까지 찾아오지 마세요. 돌아가세요."
      inner_thought: 같은 말을 다시 설명하지 말고 신고 문장과 시간을 남겨야 한다.
      intent: confrontation
    next: police_response

  - id: police_response
    kind: dual_narration
    perceived:
      atmosphere: dread
      line: "경찰은 연인 사이의 다툼을 가라앉히기 위해 두 사람을 잠시 떼어 놓았다."
      protagonist_interpretation: 민경이 진정하면 자신의 확신을 인정할 것이라 생각한다.
    reality:
      atmosphere: procedural
      line: "경찰은 두 사람을 분리하고 민경의 명시적 거절, 현장 신고와 이전 기록을 순서대로 확인했다."
      inner_thought: 반복된 거절과 기록이 현장 행동에 연결되면서 정식 신병 처리 단계로 넘어갔다.
      intent: documentation
    next: mugshot

  - id: mugshot
    kind: dual_narration
    presentation_flags: [ui_label_reveal]
    perceived:
      atmosphere: dread
      line: "플래시 속에는 강한 여자를 사랑한, 단정하고 훤칠한 중년 남자가 서 있었다."
      protagonist_interpretation: 이 사진조차 자신들의 격렬한 연애를 증명할 기록이라고 믿는다.
    reality:
      atmosphere: procedural
      line: "정식 신병 처리 뒤 촬영된 머그샷에는 166cm의 무거운 체형, 관리되지 않은 피부와 몸에 맞지 않는 정장을 입은 한도윤이 기록됐다."
      inner_thought: 반전은 외모가 아니라 명확한 거절을 반복해서 연애의 일부로 바꿔 온 행위다.
      intent: documentation
    next: record_memory

  - id: record_memory
    kind: effect
    effects:
      - {path: progress.memories, op: append_unique, value: ending.story_mode.grooms_face}
    next: true_gate

  - id: true_gate
    kind: state_gate
    transitions:
      - conditions:
          - {path: progress.cleared_routes, op: contains, value: seo_a}
          - {path: progress.memories, op: contains, value: past_case.date_mismatch}
          - {path: progress.memories, op: contains, value: ending.story_mode.grooms_face}
        node: never_dated
      - default: true
        node: company_epilogue

  - id: company_epilogue
    kind: dual_narration
    perceived:
      atmosphere: cold_office
      line: "며칠 뒤 회사는 소문이 커졌다는 이유로 자신을 내보냈다."
      protagonist_interpretation: 사내연애를 지켜 주지 못한 조직의 배신이라고 기억한다.
    reality:
      atmosphere: procedural
      line: "회사는 경찰 대응 뒤 업무 배제와 내부 확인을 거쳐 뒤늦게 해고를 통보했다."
      inner_thought: 경찰 조사가 먼저였고, 느린 회사 행정은 그 뒤에야 움직였다.
      intent: documentation
    next: grooms_face_end

  - id: never_dated
    kind: dual_narration
    presentation_flags: [original_text_lock, ui_label_reveal]
    perceived:
      atmosphere: dread
      line: "임수연은 오래전 헤어진 첫사랑이었고, 아직도 화가 풀리지 않은 채 살아 있었다."
      protagonist_interpretation: 두 번의 사랑이 모두 주변의 오해로 망가졌다고 믿는다.
    reality:
      atmosphere: procedural
      line: "임수연은 살아 있는 과거 피해자였다. 연애의 추억으로 보였던 장면은 거절, 신고와 접근 제한 기록으로 교체됐다."
      inner_thought: 완전한 원문을 확인한 것은 한도윤이 아니라 플레이어뿐이다.
      intent: documentation
    next: never_dated_end

  - id: grooms_face_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.grooms_face

  - id: never_dated_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.never_dated
