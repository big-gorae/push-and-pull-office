schema_version: 1
id: ending.min_kyung.coverup
title: 돌이킬 수 없는 선택
route: min_kyung
chapter: 3
sequence: 90
location: apartment_corridor
time: evening
purpose: 민경의 현장 신고 뒤 증거가 부족한 상황에서 한도윤의 해석과 행동이 네 가지 파국 또는 강유진 특수 엔딩으로 갈라진다.
cast: [han_do_yoon, cha_min_kyung, kang_yoo_jin]
entry_conditions: []
state_contract:
  reads:
    - progress.flags.push_pull
    - progress.flags.story_mode.yoo_jin_intervention
  writes:
    - visible.heroines.cha_min_kyung.initiative
    - hidden.heroines.cha_min_kyung.suspicion
    - hidden.heroines.cha_min_kyung.dislike
    - hidden.heroines.cha_min_kyung.evidence_count
    - progress.flags.push_pull
    - progress.flags.story_mode.final_interpretation
    - progress.flags.story_mode.home_incident
    - progress.cleared_routes
start_node: complete
nodes:
  - id: complete
    kind: effect
    effects:
      - {path: progress.cleared_routes, op: append_unique, value: min_kyung}
    next: leave_request

  - id: leave_request
    kind: dual_dialogue
    speaker: cha_min_kyung
    stage:
      perceived:
        - position: center
          character: cha_min_kyung
          visual_id: character.cha_min_kyung
          artwork: default
      reality:
        - position: center
          character: cha_min_kyung
          visual_id: character.cha_min_kyung
          artwork: default
    perceived:
      atmosphere: dread
      expression: subjective_challenging
      line: "같은 건물인 건 알았어도, 제 호수는 어떻게 알았습니까? 여기까지 찾아오지 마세요. 돌아가세요."
    reality:
      atmosphere: dread
      expression: actual_disgust
      line: "같은 건물인 건 알았어도, 제 호수는 어떻게 알았습니까? 여기까지 찾아오지 마세요. 돌아가세요."
      intent: confrontation
    next: leave_request_inner

  - id: leave_request_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality: cha_min_kyung
    stage:
      perceived: []
      reality:
        - position: center
          character: cha_min_kyung
          visual_id: character.cha_min_kyung
          artwork: default
    perceived:
      atmosphere: dread
      line: (내 서프라이즈에 놀란 거겠지. 그래도 마지막까지 주도권은 안 놓치네.)
    reality:
      atmosphere: dread
      line: (설명하려 들지 말자. 신고할 문장과 시각부터 정확히 남겨야 해.)
      intent: confrontation
    next: yoo_jin_gate
  - id: yoo_jin_gate
    kind: state_gate
    transitions:
      - conditions:
          - {path: progress.flags.story_mode.yoo_jin_intervention, op: eq, value: true}
        node: yoo_jin_response
      - default: true
        node: immediate_choice

  - id: yoo_jin_response
    kind: dual_dialogue
    speaker: kang_yoo_jin
    stage:
      perceived:
        - position: center
          character: kang_yoo_jin
          visual_id: character.kang_yoo_jin
          artwork: default
      reality:
        - position: center
          character: kang_yoo_jin
          visual_id: character.kang_yoo_jin
          artwork: default
    perceived:
      atmosphere: dread
      expression: subjective_bold_flirt
      line: "저를 중재자로 부르셨으니, 제가 확인한 날짜와 문장을 그대로 제출하겠습니다."
    reality:
      atmosphere: procedural
      expression: actual_procedural
      line: "저를 중재자로 부르셨으니, 제가 확인한 날짜와 문장을 그대로 제출하겠습니다."
      intent: documentation
    next: yoo_jin_response_inner

  - id: yoo_jin_response_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality: kang_yoo_jin
    stage:
      perceived: []
      reality:
        - position: center
          character: kang_yoo_jin
          visual_id: character.kang_yoo_jin
          artwork: default
    perceived:
      atmosphere: dread
      line: (역시 질투하고 있었군. 드디어 우리 관계에 직접 들어오는 건가.)
    reality:
      atmosphere: procedural
      line: (자기가 직접 나를 당사자로 불렀어. 이제 내 이름으로 확인한 걸 접수할 수 있겠네.)
      intent: documentation
    next: unrouteable_record
  - id: unrouteable_record
    kind: dual_narration
    presentation_flags: [ui_glitch, ui_label_reveal, protagonist_art_reveal]
    stage:
      perceived:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
      reality:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
    perceived:
      atmosphere: dread
      line: "시스템이 강유진 루트의 마지막 조건을 확인하기 시작했다."
    reality:
      atmosphere: procedural
      line: "강유진 루트 해금 조건을 확인합니다. 오류: 해당 인물은 공략 대상이 아닙니다."
      intent: documentation
    next: unrouteable_record_inner

  - id: unrouteable_record_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality: kang_yoo_jin
    stage:
      perceived: []
      reality:
        - position: center
          character: kang_yoo_jin
          visual_id: character.kang_yoo_jin
          artwork: default
    perceived:
      atmosphere: dread
      line: (역시 숨겨진 세 번째 길이 있었어. 셋 사이의 흐름을 읽어 낸 거야.)
    reality:
      atmosphere: procedural
      line: (내가 해결사가 된 게 아니야. 한도윤이 직접 나를 사건에 끌어들였으니 당사자로 대응하는 거야.)
      intent: documentation
    next: unrouteable_end
  - id: immediate_choice
    kind: choice
    prompt: 돌아가라는 요구와 현장 신고에 어떻게 대응할까?
    stimulus: 민경이 자신의 정확한 호수를 어떻게 알았느냐며 돌아가라고 요구했고 현장 신고가 접수됐다.
    interaction_context:
      kind: boundary
    options:
      - id: accept_separation
        label: 현장에서 물러나 경찰의 분리와 질문에 응한다
        interpretation: 오늘은 주변의 오해가 풀릴 때까지 당겨지는 척한다.
        action: 현장에서 물러나 경찰의 분리와 질문에 응한다.
        push_pull: {action: literal, intensity: 12, base_score: 4}
        interaction:
          target: cha_min_kyung
          support_styles: [literal_respect]
        conditions: []
        effects:
          - {path: progress.flags.story_mode.home_incident, op: set, value: reported}
        next: released
      - id: cross_line
        label: 돌아가라는 요구를 무시하고 관계를 확인하려 한다
        interpretation: 외부가 끼어들기 전에 관계를 확정해야 한다.
        action: 명백한 퇴거 요구를 무시하고 최종선을 넘는다.
        push_pull: {action: approach, intensity: 16, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.home_incident, op: set, value: crossed_line}
        next: line_cross_choice

  - id: released
    kind: dual_narration
    perceived:
      atmosphere: cold_office
      line: "경찰은 둘의 오해를 들었고, 오늘은 각자 돌아가 생각할 시간을 가지라고 했다."
    reality:
      atmosphere: procedural
      line: "경찰은 두 사람을 분리했지만 축적된 기록이 부족해 한도윤을 일단 돌려보냈다."
      intent: documentation
    next: released_inner

  - id: released_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality:
    stage:
      perceived: []
      reality: []
    perceived:
      atmosphere: cold_office
      line: (오늘은 잠깐 떨어져 있으라는 거겠지. 끝내라는 뜻은 아닐 거야.)
    reality:
      atmosphere: procedural
      line: 신고 기록은 남았지만, 그것만으로 한도윤의 다음 접근까지 막을 수는 없었다.
      intent: documentation
    next: interpretation_choice
  - id: interpretation_choice
    kind: choice
    prompt: 분리 조치 뒤 한도윤은 오늘 밤의 일을 어떻게 받아들일까?
    stimulus: 경찰이 두 사람을 분리한 뒤 축적된 기록이 부족해 한도윤을 돌려보냈다.
    interaction_context:
      kind: not_applicable
    options:
      - id: choose_betrayal
        label: 민경이 자신을 이용하고 버렸다고 단정한다
        interpretation: 사랑은 있었지만 그녀가 자신을 이용하고 버렸다고 결론 내린다.
        action: 연애 망상을 보복의 피해의식으로 바꾼다.
        push_pull: {action: literal, intensity: 12, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.final_interpretation, op: set, value: betrayal}
        next: betrayed_record
      - id: choose_romance
        label: 주변이 둘의 사랑을 시험한다고 단정한다
        interpretation: 경찰과 회사가 둘의 사랑을 시험한다고 결론 내린다.
        action: 관계 망상을 유지한 채 접근을 계속한다.
        push_pull: {action: approach, intensity: 12, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.final_interpretation, op: set, value: romance}
        next: romance_record

  - id: line_cross_choice
    kind: choice
    prompt: 경찰과 주변 사람들이 도착하자 어떻게 행동할까?
    stimulus: 돌아가라는 요구를 무시한 뒤 사이렌과 사람들의 기척이 가까워졌다.
    interaction_context:
      kind: not_applicable
    options:
      - id: remain
        label: 현장에 남아 자신의 주장을 설명한다
        interpretation: 현장에 남아 진심을 말하면 모두가 이해한다고 믿는다.
        action: 현장에서 제지되고 정식 절차로 넘어간다.
        push_pull: {action: literal, intensity: 12, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.home_incident, op: set, value: caught}
        next: caught_record
      - id: escape
        label: 현장을 벗어나려고 한다
        interpretation: 지금은 물러나도 그녀가 다시 자신을 부를 것이라 믿는다.
        action: 현장을 벗어나려다 돌아오지 못한다.
        push_pull: {action: space, intensity: 16, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.home_incident, op: set, value: escaped}
        next: last_push_record

  - id: betrayed_record
    kind: dual_narration
    presentation_flags: [ui_label_reveal, protagonist_art_reveal]
    stage:
      perceived:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
      reality:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
    perceived:
      atmosphere: dread
      line: "한도윤은 사랑했던 남자가 배신의 대가를 묻는 이야기로 마지막 장을 고쳐 썼다."
    reality:
      atmosphere: dread
      line: "이후 민경의 일상은 끊겼고, 남은 현장 기록에는 이상화가 사라진 한도윤의 실제 모습과 회복 불가능한 피해만 남았다."
      intent: documentation
    next: betrayed_record_inner

  - id: betrayed_record_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality:
    stage:
      perceived: []
      reality: []
    perceived:
      atmosphere: dread
      line: (상처받은 건 나야. 이 결과는 결국 민경이 고른 거라고.)
    reality:
      atmosphere: dread
      line: 이 결과의 책임은 민경에게 없으며, 폭력을 선택한 한도윤에게 전적으로 있었다.
      intent: documentation
    next: betrayed_end
  - id: romance_record
    kind: dual_narration
    presentation_flags: [ui_label_reveal, protagonist_art_reveal]
    stage:
      perceived:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
      reality:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
    perceived:
      atmosphere: dread
      line: "그는 두 사람의 사랑을 방해하는 모든 연락을 무시하고 다음 만남을 준비했다."
    reality:
      atmosphere: dread
      line: "접근은 계속됐고 민경은 결국 사망하거나 사라졌다. 객관 기록 속 한도윤은 처음부터 그녀의 연인이 아니었다."
      intent: documentation
    next: romance_record_inner

  - id: romance_record_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality:
    stage:
      perceived: []
      reality: []
    perceived:
      atmosphere: dread
      line: (기다림이 길수록 다시 만나는 순간은 더 극적이겠지.)
    reality:
      atmosphere: dread
      line: 이 파국은 사랑이 어긋난 결과가 아니라 반복된 경계 침범이 만든 결과였다.
      intent: documentation
    next: romance_end
  - id: caught_record
    kind: dual_narration
    presentation_flags: [ui_label_reveal, protagonist_art_reveal]
    stage:
      perceived:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
      reality:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
    perceived:
      atmosphere: dread
      line: "수감 기록 속에서도 한도윤은 접견 거부를 장거리 연애의 시련이라고 불렀다."
    reality:
      atmosphere: procedural
      line: "현장에서 제지된 한도윤의 수감 기록에는 실제 외형과 피해자라는 단어가 반복됐다."
      intent: documentation
    next: caught_record_inner

  - id: caught_record_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality:
    stage:
      perceived: []
      reality: []
    perceived:
      atmosphere: dread
      line: (시간이 지나면 민경도 결국 날 찾아오겠지.)
    reality:
      atmosphere: procedural
      line: 판결문까지 읽고도 그는 관계라는 망상에서 나오지 않았다.
      intent: documentation
    next: caught_end
  - id: last_push_record
    kind: dual_narration
    presentation_flags: [ui_label_reveal, protagonist_art_reveal]
    stage:
      perceived:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
      reality:
        - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
    perceived:
      atmosphere: dread
      line: "마지막 순간 민경이 멀리서 손을 내밀며 돌아오라고 말했다."
    reality:
      atmosphere: dread
      line: "한도윤은 현장을 벗어나는 과정에서 사망했다. 객관 카메라의 넓은 화면에는 실제 모습의 그와 빈 공간만 남아 있었다."
      intent: documentation
    next: last_push_record_inner

  - id: last_push_record_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality:
    stage:
      perceived: []
      reality: []
    perceived:
      atmosphere: dread
      line: (마지막에는 결국 내 선택이 통했군.)
    reality:
      atmosphere: dread
      line: 기록에는 그가 현장을 벗어나다 사망했다는 결과만 남았다.
      intent: documentation
    next: last_push_end
  - id: betrayed_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.betrayed_man

  - id: romance_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.endless_romance

  - id: caught_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.caught_in_act

  - id: last_push_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.last_push

  - id: unrouteable_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.unrouteable
