schema_version: 1
id: ending.min_kyung.coverup
title: 마지막 밀당
route: min_kyung
chapter: 3
sequence: 90
location: apartment_corridor
time: evening
purpose: 민경의 현장 신고 뒤 증거가 부족한 상황에서 한도윤의 해석과 행동이 네 가지 파국 또는 강유진 특수 엔딩으로 갈라진다.
cast: [han_do_yoon, cha_min_kyung, kang_yoo_jin]
entry_conditions: []
state_contract:
  reads:
    - progress.flags.push_pull
    - progress.flags.story_mode.yoo_jin_intervention
  writes:
    - visible.heroines.cha_min_kyung.initiative
    - hidden.heroines.cha_min_kyung.suspicion
    - hidden.heroines.cha_min_kyung.dislike
    - hidden.heroines.cha_min_kyung.evidence_count
    - progress.flags.push_pull
    - progress.flags.story_mode.final_interpretation
    - progress.flags.story_mode.home_incident
    - progress.cleared_routes
    - progress.unlocked_modes
start_node: complete
nodes:
  - id: complete
    kind: effect
    effects:
      - {path: progress.cleared_routes, op: append_unique, value: min_kyung}
      - {path: progress.unlocked_modes, op: append_unique, value: truth_view}
      - {path: progress.unlocked_modes, op: append_unique, value: survivor_view}
    next: leave_request

  - id: leave_request
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: dread
      expression: subjective_challenging
      line: "제 주소를 어떻게 알았습니까? 여기까지 찾아오지 마세요. 돌아가세요."
      protagonist_interpretation: 자신의 서프라이즈에 흔들리면서도 마지막까지 주도권을 넘기지 않으려 한다고 믿는다.
    reality:
      atmosphere: dread
      expression: actual_disgust
      line: "제 주소를 어떻게 알았습니까? 여기까지 찾아오지 마세요. 돌아가세요."
      inner_thought: 설득하지 말고 신고 문장과 시간을 정확히 남겨야 한다.
      intent: confrontation
    next: yoo_jin_gate

  - id: yoo_jin_gate
    kind: state_gate
    transitions:
      - conditions:
          - {path: progress.flags.story_mode.yoo_jin_intervention, op: eq, value: true}
        node: yoo_jin_response
      - default: true
        node: immediate_choice

  - id: yoo_jin_response
    kind: dual_dialogue
    speaker: kang_yoo_jin
    perceived:
      atmosphere: dread
      expression: subjective_bold_flirt
      line: "저를 중재자로 부르셨으니, 제가 확인한 날짜와 문장을 그대로 제출하겠습니다."
      protagonist_interpretation: 질투를 숨기던 유진이 마침내 둘의 관계에 공식적으로 뛰어들었다고 믿는다.
    reality:
      atmosphere: procedural
      expression: actual_procedural
      line: "저를 중재자로 부르셨으니, 제가 확인한 날짜와 문장을 그대로 제출하겠습니다."
      inner_thought: 스스로 나를 직접 당사자로 끌어들였다. 이제 추측이 아니라 내 이름으로 접수할 수 있다.
      intent: documentation
    next: unrouteable_record

  - id: unrouteable_record
    kind: dual_narration
    presentation_flags: [ui_glitch, ui_label_reveal]
    perceived:
      atmosphere: dread
      line: "시스템이 강유진 루트의 마지막 조건을 확인하기 시작했다."
      protagonist_interpretation: 세 사람의 밀당 끝에 숨겨진 세 번째 루트가 열렸다고 확신한다.
    reality:
      atmosphere: procedural
      line: "강유진 루트 해금 조건을 확인합니다. 오류: 해당 인물은 공략 대상이 아닙니다."
      inner_thought: 유진은 구원자로 나타난 것이 아니라 한도윤이 직접 사건에 끌어들인 당사자로서 대응했다.
      intent: documentation
    next: unrouteable_end

  - id: immediate_choice
    kind: choice
    prompt: 그녀의 신고를 어떤 밀당으로 받아들일까?
    options:
      - id: accept_separation
        label: 일단 한발 물러난다
        interpretation: 오늘은 주변의 오해가 풀릴 때까지 당겨지는 척한다.
        action: 현장에서 물러나 경찰의 분리와 질문에 응한다.
        push_pull: {action: literal, intensity: 12, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.home_incident, op: set, value: reported}
        next: released
      - id: cross_line
        label: 사랑을 직접 증명한다
        interpretation: 외부가 끼어들기 전에 관계를 확정해야 한다.
        action: 명백한 퇴거 요구를 무시하고 최종선을 넘는다.
        push_pull: {action: approach, intensity: 16, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.home_incident, op: set, value: crossed_line}
        next: line_cross_choice

  - id: released
    kind: dual_narration
    perceived:
      atmosphere: cold_office
      line: "경찰은 둘의 오해를 들었고, 오늘은 각자 돌아가 생각할 시간을 가지라고 했다."
      protagonist_interpretation: 잠깐 떨어져 있으라는 조언이 관계를 끝내라는 뜻은 아니라고 믿는다.
    reality:
      atmosphere: procedural
      line: "경찰은 두 사람을 분리했지만 축적된 기록이 부족해 한도윤을 일단 돌려보냈다."
      inner_thought: 신고 기록은 남았으나 그것만으로 이후의 접근을 막지는 못했다.
      intent: documentation
    next: interpretation_choice

  - id: interpretation_choice
    kind: choice
    prompt: 오늘 밤의 거절은 무엇을 뜻했을까?
    options:
      - id: choose_betrayal
        label: 그녀가 나를 배신했다
        interpretation: 사랑은 있었지만 그녀가 자신을 이용하고 버렸다고 결론 내린다.
        action: 연애 망상을 보복의 피해의식으로 바꾼다.
        push_pull: {action: literal, intensity: 12, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.final_interpretation, op: set, value: betrayal}
        next: betrayed_record
      - id: choose_romance
        label: 사랑을 지켜야 한다
        interpretation: 경찰과 회사가 둘의 사랑을 시험한다고 결론 내린다.
        action: 관계 망상을 유지한 채 접근을 계속한다.
        push_pull: {action: approach, intensity: 12, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.final_interpretation, op: set, value: romance}
        next: romance_record

  - id: line_cross_choice
    kind: choice
    prompt: 사이렌과 사람들의 기척이 가까워진다.
    options:
      - id: remain
        label: 오해를 직접 설명한다
        interpretation: 현장에 남아 진심을 말하면 모두가 이해한다고 믿는다.
        action: 현장에서 제지되고 정식 절차로 넘어간다.
        push_pull: {action: literal, intensity: 12, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.home_incident, op: set, value: caught}
        next: caught_record
      - id: escape
        label: 둘만의 시간을 되찾는다
        interpretation: 지금은 물러나도 그녀가 다시 자신을 부를 것이라 믿는다.
        action: 현장을 벗어나려다 돌아오지 못한다.
        push_pull: {action: space, intensity: 16, base_score: 4}
        conditions: []
        effects:
          - {path: progress.flags.story_mode.home_incident, op: set, value: escaped}
        next: last_push_record

  - id: betrayed_record
    kind: dual_narration
    presentation_flags: [ui_label_reveal]
    perceived:
      atmosphere: dread
      line: "한도윤은 사랑했던 남자가 배신의 대가를 묻는 이야기로 마지막 장을 고쳐 썼다."
      protagonist_interpretation: 자신이 상처받은 쪽이며 그녀가 모든 결과를 선택했다고 믿는다.
    reality:
      atmosphere: dread
      line: "이후 민경의 일상은 끊겼고, 남은 현장 기록에는 이상화가 사라진 한도윤의 실제 모습과 회복 불가능한 피해만 남았다."
      inner_thought: 민경의 선택은 폭력의 원인이 아니며 책임은 전적으로 한도윤에게 있다.
      intent: documentation
    next: betrayed_end

  - id: romance_record
    kind: dual_narration
    presentation_flags: [ui_label_reveal]
    perceived:
      atmosphere: dread
      line: "그는 두 사람의 사랑을 방해하는 모든 연락을 무시하고 다음 만남을 준비했다."
      protagonist_interpretation: 기다림이 길수록 재회가 극적일 것이라 믿는다.
    reality:
      atmosphere: dread
      line: "접근은 계속됐고 민경은 결국 사망하거나 사라졌다. 객관 기록 속 한도윤은 처음부터 그녀의 연인이 아니었다."
      inner_thought: 파국은 사랑의 실패가 아니라 반복된 경계 침범의 결과다.
      intent: documentation
    next: romance_end

  - id: caught_record
    kind: dual_narration
    presentation_flags: [ui_label_reveal]
    perceived:
      atmosphere: dread
      line: "수감 기록 속에서도 한도윤은 접견 거부를 장거리 연애의 시련이라고 불렀다."
      protagonist_interpretation: 시간이 지나면 민경이 자신을 찾아올 것이라 믿는다.
    reality:
      atmosphere: procedural
      line: "현장에서 제지된 한도윤의 수감 기록에는 실제 외형과 피해자라는 단어가 반복됐다."
      inner_thought: 그는 판결문을 읽고도 관계 망상에서 나오지 않았다.
      intent: documentation
    next: caught_end

  - id: last_push_record
    kind: dual_narration
    presentation_flags: [ui_label_reveal]
    perceived:
      atmosphere: dread
      line: "마지막 순간 민경이 멀리서 손을 내밀며 돌아오라고 말했다."
      protagonist_interpretation: 자신의 마지막 밀기가 성공했다고 믿는다.
    reality:
      atmosphere: dread
      line: "한도윤은 현장을 벗어나는 과정에서 사망했다. 객관 카메라의 넓은 화면에는 실제 모습의 그와 빈 공간만 남아 있었다."
      inner_thought: 구체적인 도주와 사망 방법은 기록하지 않는다.
      intent: documentation
    next: last_push_end

  - id: betrayed_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.betrayed_man

  - id: romance_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.endless_romance

  - id: caught_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.caught_in_act

  - id: last_push_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.last_push

  - id: unrouteable_end
    kind: exit
    transitions:
      - default: true
        ending: true
        ending_id: story_mode.unrouteable
