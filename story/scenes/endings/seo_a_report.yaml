schema_version: 1
id: ending.seo_a.report
title: 신랑의 얼굴
route: seo_a
chapter: 3
sequence: 91
location: apartment_corridor
time: evening
purpose: 서아의 집을 찾아간 뒤 현장 신고와 기존 기록이 연결되고, 정식 신병 처리 후 객관 기록에서 한도윤의 실제 모습과 관계의 진실이 드러난다.
cast: [han_do_yoon, yoon_seo_a]
entry_conditions: []
state_contract:
  reads:
  - progress.cleared_routes
  - progress.memories
  writes:
  - progress.cleared_routes
  - progress.memories
  - progress.flags.story_mode.home_incident
start_node: complete
nodes:
- id: complete
  kind: effect
  effects:
  - {path: progress.cleared_routes, op: append_unique, value: seo_a}
  - {path: progress.flags.story_mode.home_incident, op: set, value: reported}
  next: leave_request

- id: leave_request
  kind: dialogue
  speaker: yoon_seo_a
  stage:
  - position: center
    character: yoon_seo_a
    visual_id: character.yoon_seo_a
    artwork: default
  expression: actual_tense
  line: "같은 건물인 건 알았어도, 제 호수는 어떻게 알았어요? 여기까지 찾아오지 마세요. 돌아가세요."
  next: police_response

- id: police_response
  kind: narration
  line: "경찰은 두 사람을 분리하고 서아의 퇴거 요구, 현장 신고와 이전 기록을 순서대로 확인했다."
  next: mugshot

- id: mugshot
  kind: narration
  presentation_flags:
  - ui_label_reveal
  - protagonist_art_reveal
  stage:
  - {position: center, character: han_do_yoon, visual_id: character.han_do_yoon, artwork: default}
  line: "정식 신병 처리 뒤 촬영된 머그샷에는 166cm의 비대한 체형, 심하게 무너진 얼굴 비율과 성긴 머리숱, 거칠고 번들거리는 피부, 불결한 수염과 누렇게 상한 치아가 두드러지는 한도윤이 기록됐다."
  next: record_memory

- id: record_memory
  kind: effect
  effects:
  - {path: progress.memories, op: append_unique, value: ending.story_mode.grooms_face}
  next: true_gate

- id: true_gate
  kind: state_gate
  transitions:
  - conditions:
    - {path: progress.cleared_routes, op: contains, value: yoo_jin}
    - {path: progress.memories, op: contains, value: past_case.date_mismatch}
    - {path: progress.memories, op: contains, value: ending.story_mode.grooms_face}
    node: never_dated
  - default: true
    node: company_epilogue

- id: company_epilogue
  kind: narration
  line: "회사는 경찰 대응 뒤 업무 배제와 내부 확인을 거쳐 뒤늦게 해고를 통보했다."
  next: grooms_face_end

- id: never_dated
  kind: narration
  presentation_flags:
  - ui_label_reveal
  line: "임수연은 살아 있는 과거 피해자였다. 연애의 추억으로 보였던 장면은 거절, 신고와 접근 제한 기록으로 교체됐다."
  next: never_dated_end

- id: grooms_face_end
  kind: exit
  transitions:
  - default: true
    ending: true
    ending_id: story_mode.grooms_face

- id: never_dated_end
  kind: exit
  transitions:
  - default: true
    ending: true
    ending_id: story_mode.never_dated
