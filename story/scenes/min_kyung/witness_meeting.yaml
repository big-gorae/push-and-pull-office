schema_version: 1
id: min_kyung.witness_meeting
title: 둘만 남지 않는 회의
route: min_kyung
chapter: 1
sequence: 20
location: glass_meeting_room
time: afternoon
purpose: 민경이 목격자를 배석시키는 행동을 주인공이 질투 유발로 오해한다.
cast: [han_do_yoon, cha_min_kyung, yoon_seo_a]
entry_conditions: []
state_contract:
  reads:
    - hidden.heroines.cha_min_kyung.suspicion
    - hidden.heroines.cha_min_kyung.dislike
    - hidden.heroines.cha_min_kyung.evidence_count
    - progress.flags.push_pull
  writes:
    - visible.heroines.cha_min_kyung.initiative
    - hidden.heroines.cha_min_kyung.suspicion
    - hidden.heroines.cha_min_kyung.dislike
    - hidden.heroines.cha_min_kyung.evidence_count
    - progress.flags.push_pull
start_node: posture_gate
nodes:
  - id: posture_gate
    kind: state_gate
    transitions:
      - conditions:
          - {path: hidden.heroines.cha_min_kyung.suspicion, op: gte, value: 30}
        node: protective
      - default: true
        node: skeptical

  - id: protective
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      expression: subjective_jealous
      line: "서아 씨가 회의록을 함께 작성할 겁니다."
    reality:
      atmosphere: guarded_office
      expression: actual_protective
      line: "서아 씨가 회의록을 함께 작성할 겁니다."
      intent: self_protection
    next: protective_inner

  - id: protective_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      line: (다른 여자를 앞세워서 내 반응을 보려는 거군.)
    reality:
      atmosphere: guarded_office
      line: (오늘은 절대 둘만 남지 말자.)
      intent: self_protection
    next: choose
  - id: skeptical
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      expression: subjective_challenging
      line: "회의록 담당으로 서아 씨가 배석합니다."
    reality:
      atmosphere: cold_office
      expression: actual_skeptical
      line: "회의록 담당으로 서아 씨가 배석합니다."
      intent: documentation
    next: skeptical_inner

  - id: skeptical_inner
    kind: dual_dialogue
    presentation_flags:
      - inner_voice
    speakers:
      perceived: han_do_yoon
      reality: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      line: (서아 씨를 데려와 내 질투를 살짝 건드려 보겠다는 건가.)
    reality:
      atmosphere: cold_office
      line: (업무 형식을 확실히 해 두면 쓸데없는 말을 줄일 수 있겠지.)
      intent: documentation
    next: choose
  - id: choose
    kind: choice
    prompt: 서아가 함께 있는 회의에서 민경에게 어떻게 행동할까?
    stimulus: 민경이 서아를 회의록 담당으로 배석시키며 둘만의 회의를 피했다.
    options:
      - id: public_tease
        label: 서아 앞에서 민경과의 사적 연락을 암시한다
        interpretation: 공개된 자리에서 은근한 관계를 확인시킨다.
        action: 두 사람 앞에서 민경과의 사적 연락을 암시한다.
        push_pull: {action: approach, intensity: 16, base_score: 4}
        conditions: []
        effects:
          - {path: hidden.heroines.cha_min_kyung.suspicion, op: add, value: 20}
          - {path: hidden.heroines.cha_min_kyung.dislike, op: add, value: 18}
          - {path: hidden.heroines.cha_min_kyung.evidence_count, op: add, value: 1}
        next: public_tease_response
      - id: retaliatory_push
        label: 이 자리에서 민경을 다음 비공식 프로젝트 논의에서 제외하겠다고 말한다
        interpretation: 주도권을 되찾기 위해 관심을 완전히 거둔다.
        action: 민경이 듣는 자리에서 다음 비공식 프로젝트 논의에 부르지 않겠다고 통보한다.
        push_pull: {action: space, intensity: 16, base_score: 4}
        conditions: []
        effects:
          - {path: hidden.heroines.cha_min_kyung.suspicion, op: add, value: 25}
          - {path: hidden.heroines.cha_min_kyung.dislike, op: add, value: 25}
          - {path: hidden.heroines.cha_min_kyung.evidence_count, op: add, value: 1}
        next: retaliatory_response
      - id: work_only
        label: 사적인 언급 없이 민경이 정리한 안건 순서대로 확인한다
        interpretation: 사적인 의미를 붙이지 않고 오늘은 업무만 마무리한다.
        action: 승인 회신, 수정 범위와 담당자를 확인하고 실무 책임자인 민경의 진행 순서를 따른다.
        push_pull: {action: literal, intensity: 12, base_score: 4}
        interaction:
          target: cha_min_kyung
          support_styles: [factual_clarification, practical_resolution, autonomy_return, literal_respect]
        conditions: []
        effects:
          - {path: hidden.heroines.cha_min_kyung.suspicion, op: add, value: -3}
        next: work_only_do_yoon

  - id: public_tease_response
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      expression: subjective_challenging
      line: "사적인 관계는 없습니다. 업무 외 연락은 중단해 달라고 요청했습니다. 이 발언은 제가 별도로 기록하겠습니다. 서아 씨는 회의 안건만 기록해 주세요."
    reality:
      atmosphere: guarded_office
      expression: actual_disgust
      line: "사적인 관계는 없습니다. 업무 외 연락은 중단해 달라고 요청했습니다. 이 발언은 제가 별도로 기록하겠습니다. 서아 씨는 회의 안건만 기록해 주세요."
      intent: confrontation
    next: public_tease_inner

  - id: public_tease_inner
    kind: dual_dialogue
    presentation_flags: [inner_voice]
    speakers:
      perceived: han_do_yoon
      reality: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      line: (서아 씨 앞이라 더 강하게 부정하는군. 의식할수록 말은 세지는 법이지.)
    reality:
      atmosphere: guarded_office
      line: (사적인 암시를 사실처럼 남기게 둘 수는 없어. 원문과 참석자는 내가 따로 기록하고, 서아 씨는 회의 안건만 맡게 하자.)
      intent: documentation
    next: leave

  - id: retaliatory_response
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      expression: subjective_challenging
      line: "실무 책임자를 제외한 비공식 논의는 프로젝트 결정으로 인정할 수 없습니다. 참석자와 결과는 메일로 확인하겠습니다."
    reality:
      atmosphere: guarded_office
      expression: actual_disgust
      line: "실무 책임자를 제외한 비공식 논의는 프로젝트 결정으로 인정할 수 없습니다. 참석자와 결과는 메일로 확인하겠습니다."
      intent: documentation
    next: retaliatory_inner

  - id: retaliatory_inner
    kind: dual_dialogue
    presentation_flags: [inner_voice]
    speakers:
      perceived: han_do_yoon
      reality: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      line: (제외한다니까 바로 다음 수를 꺼내네. 역시 쉽게 주도권을 내줄 상대가 아니야.)
    reality:
      atmosphere: guarded_office
      line: (담당자를 빼고 결정하려는 시도까지 기록해 두자. 공식 결과가 아니라고 바로 선을 그어야 해.)
      intent: documentation
    next: leave

  - id: work_only_do_yoon
    kind: dual_dialogue
    speaker: han_do_yoon
    perceived:
      atmosphere: playful_tension
      expression: subjective_confident
      line: "승인 회신, 수정 범위, 담당자 순서로 확인하죠. 차 대리가 준비한 안건대로 진행하겠습니다."
    reality:
      atmosphere: procedural
      expression: actual_waiting_smile
      line: "승인 회신, 수정 범위, 담당자 순서로 확인하죠. 차 대리가 준비한 안건대로 진행하겠습니다."
      intent: work_only
    next: work_only_response

  - id: work_only_response
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      expression: subjective_challenging
      line: "좋습니다. 승인 회신, 수정 범위, 담당자 순서로 확인하겠습니다. 서아 씨는 결정 사항과 시각만 기록해 주세요."
    reality:
      atmosphere: procedural
      expression: actual_focused
      line: "좋습니다. 승인 회신, 수정 범위, 담당자 순서로 확인하겠습니다. 서아 씨는 결정 사항과 시각만 기록해 주세요."
      intent: documentation
    next: work_only_inner

  - id: work_only_inner
    kind: dual_dialogue
    presentation_flags: [inner_voice]
    speakers:
      perceived: han_do_yoon
      reality: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      line: (내가 핵심을 짚으니 차 대리도 바로 호흡을 맞추는군.)
    reality:
      atmosphere: procedural
      line: (업무 범위와 기록 방식이 분명하니 이 회의는 빨리 끝낼 수 있겠어.)
      intent: work_only
    next: leave

  - id: leave
    kind: exit
    transitions:
      - conditions:
          - {path: hidden.heroines.cha_min_kyung.evidence_count, op: gte, value: 2}
          - {path: hidden.heroines.cha_min_kyung.dislike, op: gte, value: 40}
        scene: ending.min_kyung.report
      - default: true
        scene: ending.min_kyung.coverup
