  line: 수요일 밤, 씻고 나온 한도윤은 침대 곁에 놓아 둔 《여성의 마음을 지배하는 어둠의 심리학》을 펼쳤다. 몇 줄을 읽자 온라인 강의에서 본 남자의 목소리가 머릿속에 또렷하게 들렸다.
