schema_version: 1
id: common.day_02_practical_meeting
title: 잘못 열린 발표 파일
route: seo_a
chapter: 1
sequence: 3
location: meeting_room
time: morning
purpose: 전날 준비한 소재를 한도윤이 먼저 꺼낸 뒤, 서아의 발표 실수에서 감정 인정과 사실 해결이라는 인물별 대화 순서를 첫 선택으로 가르친다.
cast: [han_do_yoon, yoon_seo_a, cha_min_kyung, kang_yoo_jin]
world_context:
  company: company.dawon_living
  project: project.harudam_spring_campaign
  interaction: meeting.cross_function_working_session
  participants:
  - member.han_do_yoon
  - member.yoon_seo_a
  - member.cha_min_kyung
  - member.kang_yoo_jin
  - member.oh_se_jin
  - member.jeong_da_eun
  - member.moon_ji_hye
entry_conditions: []
state_contract:
  reads:
  - progress.flags.push_pull
  - progress.flags.story_mode.day_02_response
  - progress.self_development.last_activity
  writes:
  - visible.heroines.yoon_seo_a.initiative
  - hidden.heroines.yoon_seo_a.suspicion
  - hidden.heroines.yoon_seo_a.dislike
  - hidden.heroines.yoon_seo_a.evidence_count
  - visible.heroines.cha_min_kyung.initiative
  - hidden.heroines.cha_min_kyung.suspicion
  - hidden.heroines.cha_min_kyung.dislike
  - hidden.heroines.cha_min_kyung.evidence_count
  - progress.flags.push_pull
  - progress.flags.story_mode.day_02_response
start_node: opening
nodes:
- id: opening
  kind: narration
  line: "목요일 오전, 영업기획팀과 브랜드마케팅팀 실무자들이 전날 확정한 제품 사양과 캠페인 일정을 점검할 회의실에 모였다."
  next: day_one_activity_reaction

- id: day_one_activity_reaction
  kind: dialogue
  speaker: han_do_yoon
  stage: []
  next: day_one_activity_response

  variants:
  - id: after_workout
    priority: 100
    self_development:
      expression: feedback.last_workout
    expression: actual_waiting_smile
    line: 오늘도 잘 부탁합니다. 요즘 운동을 다시 시작했습니다. 앉아 있는 시간이 길어서 건강부터 챙기려고요. 그럼 참석자표부터 볼까요?
  - id: after_reading
    priority: 90
    self_development:
      expression: feedback.last_reading
    expression: actual_waiting_smile
    line: 오늘도 잘 부탁합니다. 요즘 《말보다 맥락》이라는 책을 읽고 있습니다. 상대가 정한 선을 먼저 이해해야 대화도 된다는 대목이 기억에 남더군요. 그럼 참석자표부터 볼까요?
  - id: after_ott
    priority: 80
    self_development:
      expression: feedback.last_ott
    expression: actual_waiting_smile
    line: 오늘도 잘 부탁합니다. 요즘 다들 《퇴근은 내일》이라는 회사 코미디를 본다면서요? 저도 어제 몇 편 봤습니다. 요즘 화제 정도는 알아둬야 할 것 같아서요. 그럼 참석자표부터 볼까요?
  - id: after_sleep
    priority: 70
    self_development:
      expression: feedback.last_sleep
    expression: actual_waiting_smile
    line: 오늘도 잘 부탁합니다. 요즘은 늦게까지 깨어 있는 시간을 줄이고 아침 컨디션을 챙겨 보려고 합니다. 집중력 관리도 실력이라고 생각해서요. 그럼 참석자표부터 볼까요?
  - id: after_dark_psychology
    priority: 60
    self_development:
      expression: feedback.last_dark_psychology
    expression: actual_waiting_smile
    line: 오늘도 잘 부탁합니다. 요즘 《여성의 마음을 지배하는 어둠의 심리학》이라는 책과 강의를 같이 보고 있습니다. 말보다 타이밍을 먼저 읽으라는 대목이 기억에 남더군요. 그럼 참석자표부터 볼까요?
  - id: after_solo_drinking
    priority: 50
    self_development:
      expression: feedback.last_solo_drinking
    expression: actual_waiting_smile
    line: 오늘도 잘 부탁합니다. 어제는 너무 피곤해서 혼자 한잔하고 바로 잤습니다. 오늘은 정신을 좀 차려야겠군요. 그럼 참석자표부터 볼까요?
  - id: default
    default: true
    expression: actual_waiting_smile
    line: "오늘도 잘 부탁합니다. 참석자표부터 볼까요?"
- id: day_one_activity_response
  kind: dialogue
  speaker: yoon_seo_a
  stage:
  - position: center
    character: yoon_seo_a
    visual_id: character.yoon_seo_a
    artwork: default
  next: agenda

  variants:
  - id: after_workout
    priority: 100
    self_development:
      expression: feedback.last_workout
    expression: actual_social_smile
    line: 아, 운동을 다시 시작하셨군요. 참석자표는 여기 있습니다.
  - id: after_reading
