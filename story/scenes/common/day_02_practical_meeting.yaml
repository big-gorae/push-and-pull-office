  line: "죄송합니다. 제가 파일을 잘못 열어서…… 잠시만요."
  next: recovery_choice

- id: recovery_choice
  kind: choice
  prompt: 잘못된 발표 파일 앞에서 어떻게 회의를 수습할까?
  stimulus: 서아가 이전 버전의 발표 파일을 연 뒤 사과하고 말을 잇지 못했다.
  analysis_hints:
    pull: “이번 득점선은 대화를 이어 가는 쪽입니다. 서아는 사과 뒤 멈췄고 회의는 아직 진행 중입니다. 그 두 증거를 만족시키는 말로 접근하십시오.”
    push: “이번 득점선은 말을 줄이고 물러나는 쪽입니다. 서아가 직접 계속할 여지를 남기는지가 핵심입니다. 대신 결정하거나 앞질러 나서지 마십시오.”
    none: “아직 첫 수라 정해진 득점선은 없습니다. 서아의 멈춘 말과 계속되어야 할 안건 중 어느 단서에 답할지 정하면, 그 선택이 다음 리듬의 기준이 됩니다.”
  interaction_context:
    kind: support
  options:
  - id: acknowledge_and_ask
    label: “많이 놀랐겠네요. 잠깐 숨 고르고, 직접 이어 갈 수 있겠어요?”라고 묻는다
    interpretation: 당황한 마음을 먼저 알아주면 서아가 자신에게 더 의지할 거라고 생각한다.
    action: 서아의 당황을 인정하고 직접 발표를 계속할지 묻는다.
    push_pull: {action: approach, intensity: 12, base_score: 4}
    interaction:
      target: yoon_seo_a
      support_styles: [emotional_validation, ask_before_helping, autonomy_return]
    conditions: []
    effects:
    - {path: progress.flags.story_mode.day_02_response, op: set, value: emotional_validation}
    next: empathy_do_yoon
  - id: define_and_fix
    label: “현재 확인된 문제는 화면의 파일 버전입니다. 최신본으로 바꾸고 3쪽부터 계속하죠.”라고 정리한다
    interpretation: 핵심을 즉시 정리해 민경에게 믿을 만한 실무자라는 인상을 남긴다.
    action: 지금 확인된 오류와 아직 확인할 영향을 구분하고 최신본 교체와 재개 지점을 제안한다.
    push_pull: {target: cha_min_kyung, action: approach, intensity: 12, base_score: 4}
    interaction:
      target: cha_min_kyung
      support_styles: [factual_clarification, practical_resolution]
    conditions: []
    effects:
    - {path: progress.flags.story_mode.day_02_response, op: set, value: factual_resolution}
    next: facts_do_yoon
  - id: offer_roles
    label: “직접 이어 갈까요? 원하면 제가 파일 교체만 맡겠습니다.”라고 선택권을 준다
    interpretation: 필요한 만큼만 도우면 서아가 편하게 마음을 열 거라고 생각한다.
    action: 서아에게 발표를 계속할지 묻고, 동의하면 파일 교체만 맡겠다고 제안한다.
    push_pull: {action: space, intensity: 8, base_score: 4}
    interaction:
      target: yoon_seo_a
      support_styles: [ask_before_helping, autonomy_return, practical_resolution]
    conditions: []
    effects:
    - {path: progress.flags.story_mode.day_02_response, op: set, value: collaborative_support}
    next: roles_do_yoon
  - id: take_over
    label: 서아의 대답을 기다리지 않고 발표를 대신 이어 간다
    interpretation: 위기에서 과감하게 대신 나서면 보호받았다고 느낄 거라고 믿는다.
    action: 서아의 의사를 묻지 않고 발표 내용을 대신 설명하기 시작한다.
    push_pull: {action: approach, intensity: 16, base_score: 4}
    interaction:
      target: yoon_seo_a
      support_styles: [practical_resolution]
    conditions: []
    effects:
    - {path: progress.flags.story_mode.day_02_response, op: set, value: unsolicited_takeover}
    next: takeover_do_yoon

