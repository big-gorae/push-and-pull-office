    artwork: default
  expression: actual_social_smile
  line: "아, 네. 먼저 하루담 봄 홈카페 라인의 커피메이커·전기포트·미니오븐 구성부터 말씀드리겠습니다."
  next: wrong_slide

- id: wrong_slide
  kind: dialogue
  speaker: kang_yoo_jin
