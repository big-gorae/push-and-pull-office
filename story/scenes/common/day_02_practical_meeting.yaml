  stage: []
  line: "윤서아 사원의 홈카페 제품 구성 발표 뒤에 백화점 입점 승인 일정과 디자인 버전을 확인하겠습니다."
  next: seo_a_begins

- id: seo_a_begins
  kind: dialogue
  speaker: yoon_seo_a
  stage:
  - position: center
