    expression: actual_social_smile
    line: 아, 《퇴근은 내일》을 보셨군요. 참석자표는 여기 있습니다.
  - id: after_sleep
    priority: 70
    self_development:
      expression: feedback.last_sleep
    expression: actual_social_smile
    line: 아, 생활 리듬을 챙기시는군요. 참석자표는 여기 있습니다.
  - id: after_dark_psychology
    priority: 60
    self_development:
      expression: feedback.last_dark_psychology
    expression: actual_social_smile
    line: 아, 요즘 관계 심리 강의를 보고 계시는군요. 참석자표는 여기 있습니다.
  - id: after_solo_drinking
    priority: 50
    self_development:
      expression: feedback.last_solo_drinking
    expression: actual_social_smile
    line: 아, 어제 많이 피곤하셨나 봐요. 참석자표는 여기 있습니다.
  - id: default
    default: true
    expression: actual_social_smile
    line: "아, 네. 참석자표는 여기 있습니다."
