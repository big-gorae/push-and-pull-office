schema_version: 1
id: common.day_03_officetel_min_kyung_move_in
title: 문 앞의 이사떡
route: seo_a
chapter: 1
sequence: 5
location: officetel_unit_corridor
time: evening
purpose: 금요일 저녁 같은 오피스텔로 이사 온 차민경이 이사떡을 돌리다 서정우와 단둘이 마주치고, 서정우는 업무 밖의 편한 모습과 입주민으로서의 호의를 운명적인 연결로 받아들인다.
cast: [han_do_yoon, cha_min_kyung]
entry_conditions: []
state_contract:
  reads: []
  writes: []
start_node: knock_at_door
nodes:
- id: knock_at_door
  kind: narration
  line: "금요일 저녁, 서정우가 사는 오피스텔 현관문에 같은 층 새 입주자가 인사를 위해 노크했다."
  next: door_opens

- id: door_opens
  kind: narration
  line: "서정우가 문을 열자, 편한 셔츠 차림의 차민경이 소포장 떡을 들고 서 있었다. 복도 한쪽에는 정리 중인 이삿짐 상자가 남아 있었다."
  next: min_kyung_greeting

- id: min_kyung_greeting
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_focused
  line: "오늘 이사 왔습니다. 복도를 잠깐 써서 같은 층에 인사드리고 있습니다. 떡 하나 받으세요."
  next: mutual_surprise

- id: mutual_surprise
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_skeptical
  line: "서 과장님? 서 과장님도 여기 사십니까?"
  next: do_yoon_confirms

- id: do_yoon_confirms
  kind: dialogue
  speaker: han_do_yoon
  stage: []
  expression: actual_waiting_smile
  line: "네. 저도 여기 삽니다. 차 대리가 이사 올 줄은 정말 몰랐네요. 떡은 잘 먹겠습니다."
  next: practical_question

- id: practical_question
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_focused
  line: "큰 짐은 거의 끝났습니다. 혹시 분리배출장은 지하로 내려가면 됩니까?"
  next: do_yoon_directions

- id: do_yoon_directions
  kind: dialogue
  speaker: han_do_yoon
  stage: []
  expression: actual_waiting_smile
  line: "지하 주차장 입구 옆입니다. 처음엔 찾기 어려우니 관리 안내 표지만 따라가면 됩니다."
  next: min_kyung_thanks

- id: min_kyung_thanks
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_focused
  line: "알겠습니다. 덕분에 한 번에 찾겠네요. 다른 집에도 인사드려야 해서 가보겠습니다. 월요일에 뵙죠."
  next: leave

- id: leave
  kind: exit
  transitions:
  - default: true
    scene: common.day_04_weekend_encounter
