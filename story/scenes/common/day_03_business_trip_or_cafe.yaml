schema_version: 1
id: common.day_03_business_trip_or_cafe
title: 돌아온 뒤 남은 말
route: seo_a
chapter: 1
sequence: 4
location: office_break_room
time: afternoon
purpose: 한도윤이 전날 밤에 준비한 소재를 민경에게 자기어필한 뒤, 업무를 수습하는 동안에는 사실과 실행 가능성을 먼저 확인하고 해결 뒤에는 구체적인 부담 인정을 받아들이는 민경의 상황별 대화 순서를
  재확인한다.
cast: [han_do_yoon, yoon_seo_a, cha_min_kyung]
entry_conditions: []
state_contract:
  reads:
  - progress.self_development.last_activity
  - progress.flags.push_pull
  writes:
  - visible.heroines.cha_min_kyung.initiative
  - hidden.heroines.cha_min_kyung.suspicion
  - hidden.heroines.cha_min_kyung.dislike
  - hidden.heroines.cha_min_kyung.evidence_count
  - progress.flags.push_pull
start_node: return_to_office
nodes:
- id: return_to_office
  kind: narration
  line: "금요일 업무 일정에 따라 한도윤은 동료 한 명과 외근이나 짧은 휴식을 마친 뒤 사무실로 돌아왔다."
  next: activity_callback

- id: activity_callback
  kind: dialogue
  speaker: han_do_yoon
  stage: []
  next: activity_response

  variants:
  - id: after_workout
    priority: 100
    self_development:
      expression: feedback.last_workout
    expression: actual_waiting_smile
    line: 돌아왔으니 정리하기 전에 하나만. 요즘 운동을 다시 시작했습니다. 앉아 있는 시간이 길어서 건강부터 챙기려고요. 그럼 오늘 남은 쟁점부터 보죠.
  - id: after_reading
    priority: 90
    self_development:
      expression: feedback.last_reading
    expression: actual_waiting_smile
    line: 돌아왔으니 정리하기 전에 하나만. 요즘 《말보다 맥락》이라는 책을 읽고 있습니다. 상대가 정한 선을 먼저 이해해야 대화도 된다는 대목이 기억에 남더군요. 그럼 오늘 남은 쟁점부터 보죠.
  - id: after_ott
    priority: 80
    self_development:
      expression: feedback.last_ott
    expression: actual_waiting_smile
    line: 돌아왔으니 정리하기 전에 하나만. 요즘 다들 《퇴근은 내일》이라는 회사 코미디를 본다면서요? 저도 어제 몇 편 봤습니다. 요즘 화제 정도는 알아둬야 할 것 같아서요. 그럼 오늘 남은 쟁점부터 보죠.
  - id: after_sleep
    priority: 70
    self_development:
      expression: feedback.last_sleep
    expression: actual_waiting_smile
    line: 돌아왔으니 정리하기 전에 하나만. 요즘은 늦게까지 깨어 있는 시간을 줄이고 아침 컨디션을 챙겨 보려고 합니다. 집중력 관리도 실력이라고 생각해서요. 그럼 오늘 남은 쟁점부터 보죠.
  - id: after_dark_psychology
    priority: 60
    self_development:
      expression: feedback.last_dark_psychology
    expression: actual_waiting_smile
    line: 돌아왔으니 정리하기 전에 하나만. 요즘 《여성의 마음을 지배하는 어둠의 심리학》이라는 책과 강의를 같이 보고 있습니다. 말보다 타이밍을 먼저 읽으라는 대목이 기억에 남더군요. 그럼 오늘 남은
      쟁점부터 보죠.
  - id: after_solo_drinking
    priority: 50
    self_development:
      expression: feedback.last_solo_drinking
    expression: actual_waiting_smile
    line: 돌아왔으니 정리하기 전에 하나만. 어제는 너무 피곤해서 혼자 한잔하고 바로 잤습니다. 오늘은 정신을 좀 차려야겠군요. 그럼 오늘 남은 쟁점부터 보죠.
  - id: default
    default: true
    expression: actual_waiting_smile
    line: "돌아왔으니 오늘 확인한 입점·공개 일정 쟁점부터 정리하죠."
- id: activity_response
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  next: response_choice

  variants:
  - id: after_workout
    priority: 100
    self_development:
      expression: feedback.last_workout
    expression: actual_focused
    line: 네, 운동을 다시 시작하셨군요. 지금은 오늘 남은 쟁점 세 개부터 보죠.
  - id: after_reading
    priority: 90
    self_development:
      expression: feedback.last_reading
    expression: actual_focused
    line: 네, 요즘 책을 읽고 계시는군요. 지금은 오늘 남은 쟁점 세 개부터 보죠.
  - id: after_ott
    priority: 80
    self_development:
      expression: feedback.last_ott
    expression: actual_focused
    line: 네, 《퇴근은 내일》을 보셨군요. 지금은 오늘 남은 쟁점 세 개부터 보죠.
  - id: after_sleep
    priority: 70
    self_development:
      expression: feedback.last_sleep
    expression: actual_focused
    line: 네, 생활 리듬을 챙기시는군요. 지금은 오늘 남은 쟁점 세 개부터 보죠.
  - id: after_dark_psychology
    priority: 60
    self_development:
      expression: feedback.last_dark_psychology
    expression: actual_focused
    line: 네, 요즘 관계 심리 강의를 보고 계시는군요. 지금은 오늘 남은 쟁점 세 개부터 보죠.
  - id: after_solo_drinking
    priority: 50
    self_development:
      expression: feedback.last_solo_drinking
    expression: actual_focused
    line: 네, 어제 많이 피곤하셨나 봐요. 지금은 오늘 남은 쟁점 세 개부터 보죠.
  - id: default
    default: true
    expression: actual_focused
    line: "돌아왔으면 오늘 확인한 입점·공개 일정 쟁점부터 정리하죠."
- id: response_choice
  kind: choice
  prompt: 민경이 남은 쟁점 세 가지부터 정리하자고 한 말에 어떻게 답할까?
  stimulus: 민경은 짧은 대화를 마치고 오늘 남은 쟁점 세 가지를 먼저 보자고 했다.
  analysis_hints:
    pull: “이번 득점선은 대화를 이어 가는 쪽입니다. 민경은 잡담을 끝내고 ‘남은 쟁점 세 가지’를 직접 지정했습니다. 그 우선순위 안에서 말을 이어 가십시오.”
    push: “이번 득점선은 한발 물러나는 쪽입니다. 민경이 사적인 화제를 닫고 업무 순서를 지정한 것이 증거입니다. 대화의 범위를 더 넓히지 마십시오.”
    none: “아직 첫 수라 정해진 득점선은 없습니다. 다만 민경이 무엇을 먼저 하자고 명시했는지는 분명합니다. 그 관찰을 기준으로 이번 리듬을 정하십시오.”
  interaction_context:
    kind: coordination
  options:
  - id: structure_issues
    label: “거래처 승인 회신, 수정 범위, 공개 일정으로 나누죠. 제가 확인한 범위부터 말씀드릴 테니, 나머지 순서는 차 대리가 정해 주세요.”라고 답한다
    interpretation: 쟁점과 순서를 정확히 맞추면 민경과 일하는 호흡도 더 가까워질 거라고 생각한다.
    action: 남은 쟁점을 세 범위로 나누고 확인된 사실부터 공유한 뒤, 나머지 순서는 민경이 정하도록 제안한다.
    push_pull: {target: cha_min_kyung, action: approach, intensity: 12, base_score: 4}
    interaction:
      target: cha_min_kyung
      support_styles: [factual_clarification, practical_resolution, autonomy_return]
    conditions: []
    effects: []
    next: structure_response
  - id: acknowledge_fatigue
    label: “오늘 일정이 길었는데 많이 피곤하셨겠어요. 잠깐 쉬었다 하죠.”라고 말한다
    interpretation: 민경의 피로를 먼저 알아주면 업무 밖의 개인적인 생각도 조금은 보여 줄 거라고 생각한다.
    action: 업무 정리보다 민경의 피로를 먼저 짚고 휴식을 제안한다.
    push_pull: {target: cha_min_kyung, action: space, intensity: 12, base_score: 4}
    interaction:
      target: cha_min_kyung
      support_styles: [emotional_validation]
    conditions: []
    effects: []
    next: fatigue_response
  - id: take_all_issues
    label: “세 가지는 제가 전부 정리해서 공유하겠습니다.”라고 말한다
    interpretation: 남은 일까지 과감하게 맡으면 민경에게 든든한 사람으로 보일 거라고 생각한다.
    action: 담당 범위를 확인하지 않고 남은 쟁점 세 가지를 모두 대신 정리하겠다고 통보한다.
    push_pull: {target: cha_min_kyung, action: approach, intensity: 16, base_score: 4}
    interaction:
      target: cha_min_kyung
      support_styles: [practical_resolution]
    conditions: []
    effects: []
    next: takeover_response

- id: structure_response
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_focused
  line: "좋습니다. 그 순서면 같은 설명을 두 번 확인할 필요가 없겠네요. 수정 범위와 공개 일정은 제가 정리하겠습니다."
  next: resolution_complete

- id: fatigue_response
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_focused
  line: "피곤한 건 맞습니다. 다만 지금은 세 쟁점을 끝내는 편이 더 편합니다. 승인 회신부터 말씀해 주세요."
  next: resolution_complete

- id: takeover_response
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_focused
  line: "세 가지를 전부 맡으시면 승인 범위와 제 담당이 섞입니다. 확인한 범위만 말씀해 주세요. 나머지는 제가 정리하겠습니다."
  next: resolution_complete

- id: resolution_complete
  kind: narration
  line: "거래처 승인 회신, 수정 범위, 공개 일정의 담당과 다음 확인 시각이 모두 정리됐다. 민경은 노트북을 닫고 짧게 숨을 내쉬었다."
  next: post_resolution_choice

- id: post_resolution_choice
  kind: choice
  prompt: 업무 정리를 마친 민경에게 어떻게 말할까?
  stimulus: 세 쟁점의 담당과 다음 확인 시각을 정리한 민경이 노트북을 닫고 짧게 숨을 내쉬었다.
  analysis_hints:
    pull: “이번 득점선은 대화를 이어 가는 쪽입니다. 노트북을 닫고 나서야 숨을 내쉰 순서가 증거입니다. 해결 중이 아니라 해결 뒤에 나온 반응에 답하십시오.”
    push: “이번 득점선은 여기서 물러나는 쪽입니다. 담당과 다음 시각이 이미 정리됐고 노트북도 닫혔습니다. 끝난 대화를 다시 늘리지 않는 선택이 득점입니다.”
    none: “아직 첫 수라 정해진 득점선은 없습니다. 업무가 끝난 뒤에야 민경의 반응이 바뀌었다는 순서를 보고, 말을 더할지 닫을지 기준을 세우십시오.”
  interaction_context:
    kind: support
  options:
  - id: acknowledge_after_resolution
    label: "“세 쟁점을 끝까지 나눠 확인하느라 신경 많이 쓰셨겠어요. 이제 다 끝났는데, 잠깐 쉬시겠어요?”라고 묻는다"
    interpretation: 일을 끝낸 뒤 드러난 부담을 정확히 짚으면 민경도 업무 밖의 마음을 조금 더 보여 줄 거라고 생각한다.
    action: 해결이 끝난 뒤 민경이 감당한 구체적인 부담을 인정하고, 쉴지는 민경이 정하도록 묻는다.
    push_pull: {target: cha_min_kyung, action: approach, intensity: 12, base_score: 4}
    interaction:
      target: cha_min_kyung
      support_styles: [emotional_validation, ask_before_helping, autonomy_return]
    conditions: []
    effects: []
    next: after_resolution_empathy_response
  - id: close_with_facts
    label: "“세 건 모두 담당과 다음 확인 시각까지 정리됐습니다. 오늘은 여기서 마치죠.”라고 말한다"
    interpretation: 일을 정확히 닫고 먼저 물러나면 민경이 다음 대화를 기다릴 거라고 생각한다.
    action: 완료된 항목을 사실대로 확인하고 추가적인 감정 질문 없이 업무 대화를 끝낸다.
    push_pull: {target: cha_min_kyung, action: space, intensity: 12, base_score: 4}
    interaction:
      target: cha_min_kyung
      support_styles: [factual_clarification]
    conditions: []
    effects: []
    next: after_resolution_close_response
  - id: add_more_work
    label: "“다음 확인표도 제가 새로 만들어 둘게요. 이제는 신경 쓰지 마세요.”라고 말한다"
    interpretation: 해결책을 한 단계 더 준비하면 민경이 끝까지 믿고 맡길 사람으로 볼 거라고 생각한다.
    action: 이미 담당과 다음 확인 시각이 정리된 업무에 새 확인표를 추가하겠다고, 필요 여부를 묻지 않고 통보한다.
    push_pull: {target: cha_min_kyung, action: approach, intensity: 12, base_score: 4}
    interaction:
      target: cha_min_kyung
      support_styles: [practical_resolution, concise_reassurance]
    conditions: []
    effects: []
    next: after_resolution_overwork_response

- id: after_resolution_empathy_response
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_focused
  line: "맞습니다. 일정 자체보다 세 쟁점이 섞이지 않게 계속 확인하는 게 더 피곤했습니다. 지금은 끝났으니 잠깐 쉬겠습니다."
  next: weekend_clues

- id: after_resolution_close_response
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_focused
  line: "네. 세 건 모두 정리됐습니다. 다음 확인 때 보죠."
  next: weekend_clues

- id: after_resolution_overwork_response
  kind: dialogue
  speaker: cha_min_kyung
  stage:
  - position: center
    character: cha_min_kyung
    visual_id: character.cha_min_kyung
    artwork: default
  expression: actual_skeptical
  line: "확인 항목과 다음 시각은 이미 정리했습니다. 새 표를 만들 필요는 없습니다. 지금은 여기서 끝내죠."
  next: weekend_clues

- id: weekend_clues
  kind: narration
  line: "업무 정리 뒤 이어진 공용 대화에서 서아와 민경은 각자 주말에 들를 장소를 자연스럽게 언급했다."
  next: leave

- id: leave
  kind: exit
  transitions:
  - default: true
    scene: bonus.stat_health_sample_sorting
