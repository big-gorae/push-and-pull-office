  - id: response_choice
    kind: choice
    prompt: 민경이 남은 쟁점 세 가지부터 정리하자고 한 말에 어떻게 답할까?
    stimulus: 민경은 짧은 대화를 마치고 오늘 남은 쟁점 세 가지를 먼저 보자고 했다.
    analysis_hints:
      pull: “이번 득점선은 대화를 이어 가는 쪽입니다. 민경은 잡담을 끝내고 ‘남은 쟁점 세 가지’를 직접 지정했습니다. 그 우선순위 안에서 말을 이어 가십시오.”
      push: “이번 득점선은 한발 물러나는 쪽입니다. 민경이 사적인 화제를 닫고 업무 순서를 지정한 것이 증거입니다. 대화의 범위를 더 넓히지 마십시오.”
      none: “아직 첫 수라 정해진 득점선은 없습니다. 다만 민경이 무엇을 먼저 하자고 명시했는지는 분명합니다. 그 관찰을 기준으로 이번 리듬을 정하십시오.”
    interaction_context:
      kind: coordination
    options:
      - id: structure_issues
        label: “거래처 승인 회신, 수정 범위, 공개 일정으로 나누죠. 제가 확인한 범위부터 말씀드릴 테니, 나머지 순서는 차 대리가 정해 주세요.”라고 답한다
        interpretation: 쟁점과 순서를 정확히 맞추면 민경과 일하는 호흡도 더 가까워질 거라고 생각한다.
        action: 남은 쟁점을 세 범위로 나누고 확인된 사실부터 공유한 뒤, 나머지 순서는 민경이 정하도록 제안한다.
        push_pull: {target: cha_min_kyung, action: approach, intensity: 12, base_score: 4}
        interaction:
          target: cha_min_kyung
          support_styles: [factual_clarification, practical_resolution, autonomy_return]
        conditions: []
        effects: []
        next: structure_response
      - id: acknowledge_fatigue
        label: “오늘 일정이 길었는데 많이 피곤하셨겠어요. 잠깐 쉬었다 하죠.”라고 말한다
        interpretation: 민경의 피로를 먼저 알아주면 업무 밖의 속마음도 조금은 보여 줄 거라고 생각한다.
        action: 업무 정리보다 민경의 피로를 먼저 짚고 휴식을 제안한다.
        push_pull: {target: cha_min_kyung, action: space, intensity: 12, base_score: 4}
        interaction:
          target: cha_min_kyung
          support_styles: [emotional_validation]
        conditions: []
        effects: []
        next: fatigue_response
      - id: take_all_issues
        label: “세 가지는 제가 전부 정리해서 공유하겠습니다.”라고 말한다
        interpretation: 남은 일까지 과감하게 맡으면 민경에게 든든한 사람으로 보일 거라고 생각한다.
        action: 담당 범위를 확인하지 않고 남은 쟁점 세 가지를 모두 대신 정리하겠다고 통보한다.
        push_pull: {target: cha_min_kyung, action: approach, intensity: 16, base_score: 4}
        interaction:
