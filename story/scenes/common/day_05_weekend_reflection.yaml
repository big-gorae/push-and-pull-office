schema_version: 1
id: common.day_05_weekend_reflection
title: 두 번째 주말의 우연
route: seo_a
chapter: 1
sequence: 6
location: outside_cafe
time: afternoon
purpose: 두 번째 주말 조우에서도 한도윤이 전날 밤에 준비한 소재를 먼저 꺼내지만 두 사람 모두 각자의 만남을 한 번의 우연으로 받아들인다.
cast: [han_do_yoon]
entry_conditions: []
state_contract:
  reads:
  - progress.self_development.last_activity
  writes: []
start_node: encounter
nodes:
- id: encounter
  kind: narration
  line: "일요일에는 토요일에 만나지 않은 다른 동료와 공공장소에서 마주쳤다. 두 사람은 서로의 조우를 아직 알지 못했다."
  next: activity_callback

- id: activity_callback
  kind: dialogue
  speaker: han_do_yoon
  stage: []
  next: activity_response

  variants:
  - id: after_workout
    priority: 100
    self_development:
      expression: feedback.last_workout
    expression: actual_waiting_smile
    line: 주말에도 뵙네요. 이틀 연속 회사 사람을 밖에서 볼 줄은 몰랐습니다. 요즘 운동을 다시 시작했습니다. 주말에는 가볍게 걷는 것도 괜찮더군요. 이 근처도 산책하기 괜찮나요?
  - id: after_reading
    priority: 90
    self_development:
      expression: feedback.last_reading
    expression: actual_waiting_smile
    line: 주말에도 뵙네요. 이틀 연속 회사 사람을 밖에서 볼 줄은 몰랐습니다. 요즘 《말보다 맥락》이라는 책을 읽고 있습니다. 주말에 조용히 읽을 곳을 찾고 있었는데, 이 근처도 괜찮습니까?
  - id: after_ott
    priority: 80
    self_development:
      expression: feedback.last_ott
    expression: actual_waiting_smile
    line: 주말에도 뵙네요. 이틀 연속 회사 사람을 밖에서 볼 줄은 몰랐습니다. 요즘 다들 《퇴근은 내일》이라는 회사 코미디를 본다면서요? 저도 어제 몇 편 봤습니다. ‘회의는 끝났지만 내 마음은 야근
      중입니다’라는 대사는 원래 어느 장면에 나옵니까?
  - id: after_sleep
    priority: 70
    self_development:
      expression: feedback.last_sleep
    expression: actual_waiting_smile
    line: 주말에도 뵙네요. 이틀 연속 회사 사람을 밖에서 볼 줄은 몰랐습니다. 요즘은 늦게까지 깨어 있는 시간을 줄이고 아침 컨디션을 챙겨 보려고 합니다. 일찍 움직이니 한결 여유롭네요.
  - id: after_dark_psychology
    priority: 60
    self_development:
      expression: feedback.last_dark_psychology
    expression: actual_waiting_smile
    line: 주말에도 뵙네요. 이틀 연속 회사 사람을 밖에서 볼 줄은 몰랐습니다. 요즘 《여성의 마음을 지배하는 어둠의 심리학》이라는 책과 강의를 같이 보고 있습니다. 사람 사이의 거리를 관찰해 보라는 내용이
      있더군요.
  - id: after_solo_drinking
    priority: 50
    self_development:
      expression: feedback.last_solo_drinking
    expression: actual_waiting_smile
    line: 주말에도 뵙네요. 이틀 연속 회사 사람을 밖에서 볼 줄은 몰랐습니다. 어제는 너무 피곤해서 혼자 한잔하고 바로 잤습니다. 오늘은 술 대신 바람이나 쐬려고 나왔어요.
  - id: default
    default: true
    expression: actual_waiting_smile
    line: "주말에도 뵙네요. 이틀 연속 회사 사람을 밖에서 볼 줄은 몰랐습니다."
- id: activity_response
  kind: narration
  next: goodbye

  variants:
  - id: after_workout
    priority: 100
    self_development:
      expression: feedback.last_workout
    line: 동료는 ‘이 근처는 차가 많지 않아 걷기 괜찮은 편이에요.’라고 짧게 답한 뒤 다른 쪽을 먼저 보겠다고 말했다.
  - id: after_reading
    priority: 90
    self_development:
      expression: feedback.last_reading
    line: 동료는 ‘조용히 읽으려면 안쪽 자리가 괜찮아요.’라고 짧게 답한 뒤 다른 쪽을 먼저 보겠다고 말했다.
  - id: after_ott
    priority: 80
    self_development:
      expression: feedback.last_ott
    line: 동료는 ‘그 대사는 첫 회 회식 장면에 나와요.’라고 짧게 답한 뒤 다른 쪽을 먼저 보겠다고 말했다.
  - id: after_sleep
    priority: 70
    self_development:
      expression: feedback.last_sleep
    line: 동료는 ‘주말에는 조금 일찍 움직이면 여유 있게 둘러볼 수 있죠.’라고 짧게 답한 뒤 다른 쪽을 먼저 보겠다고 말했다.
  - id: after_dark_psychology
    priority: 60
    self_development:
      expression: feedback.last_dark_psychology
    line: 동료는 ‘그런 내용은 사람마다 다르게 받아들일 것 같아요.’라고 짧게 답한 뒤 다른 쪽을 먼저 보겠다고 말했다.
  - id: after_solo_drinking
    priority: 50
    self_development:
      expression: feedback.last_solo_drinking
    line: 동료는 ‘오늘은 무리하지 말고 쉬시는 게 좋겠네요.’라고 짧게 답한 뒤 다른 쪽을 먼저 보겠다고 말했다.
  - id: default
    default: true
    line: "동료는 ‘주말에도 뵙네요’라고 가볍게 인사했다."
- id: goodbye
  kind: narration
  line: "두 번째 동료가 실제로 한 작별 인사는 ‘월요일에 뵙겠습니다.’였다."
  next: leave

- id: leave
  kind: exit
  transitions:
  - default: true
    scene: seo_a.email_request
