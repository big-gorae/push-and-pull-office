nodes:
- id: home_arrival
  kind: narration
  line: "수요일 저녁, 한도윤은 귀가해 자신이 사는 오피스텔의 엘리베이터 앞에 섰다."
  next: doors_open

- id: doors_open
  kind: narration
  line: "엘리베이터 문이 열렸고, 편한 집업 차림으로 장바구니를 든 윤서아가 내리려다 아침에 마주친 한도윤을 알아봤다."
  next: seo_a_surprised

- id: seo_a_surprised
  kind: dialogue
  speaker: yoon_seo_a
  stage:
  - position: center
    character: yoon_seo_a
    visual_id: character.yoon_seo_a
    artwork: default
  expression: actual_social_smile
  line: "아, 과장님? 과장님도 여기 사세요?"
  next: do_yoon_answers

- id: do_yoon_answers
  kind: dialogue
  speaker: han_do_yoon
  stage: []
  expression: actual_waiting_smile
  line: "그러게요. 아침에는 출근하느라 인사도 못 했네요. 저도 여기 산 지 좀 됐습니다."
  next: seo_a_explains

- id: seo_a_explains
  kind: dialogue
  speaker: yoon_seo_a
  stage:
  - position: center
    character: yoon_seo_a
    visual_id: character.yoon_seo_a
    artwork: default
  expression: actual_flustered
  line: "저도 전부터 살았어요. 회사까지 가기 편해서요. 아침 일은…… 못 본 걸로 해주시면 감사하겠습니다."
  next: do_yoon_agrees

- id: do_yoon_agrees
  kind: dialogue
  speaker: han_do_yoon
  stage: []
  expression: actual_waiting_smile
  line: "물론이죠. 신경 쓰지 마세요."
  next: seo_a_relaxes

- id: seo_a_relaxes
  kind: dialogue
  speaker: yoon_seo_a
  stage:
  - position: center
    character: yoon_seo_a
    visual_id: character.yoon_seo_a
    artwork: default
  expression: actual_relief
  line: "감사합니다……."
  next: elevator_courtesy

- id: elevator_courtesy
  kind: dialogue
  speaker: yoon_seo_a
  stage:
  - position: center
    character: yoon_seo_a
    visual_id: character.yoon_seo_a
    artwork: default
  expression: actual_social_smile
  line: "아, 먼저 타세요. 저는 내려가서 살 게 하나 더 있어서요. 내일 뵙겠습니다."
  next: leave

- id: leave
  kind: exit
  transitions:
  - default: true
