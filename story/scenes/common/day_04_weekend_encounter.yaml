schema_version: 1
id: common.day_04_weekend_encounter
title: 첫 번째 주말의 우연
route: seo_a
chapter: 1
sequence: 5
location: outside_cafe
time: afternoon
purpose: 첫 주말 조우에서 한도윤이 전날 밤에 준비한 소재를 먼저 꺼내지만 상대는 짧은 잡담과 한 번의 우연으로 받아들인다.
cast: [han_do_yoon]
entry_conditions: []
state_contract:
  reads:
    - progress.self_development.last_activity
  writes: []
start_node: encounter
nodes:
  - id: encounter
    kind: dual_narration
    perceived:
      atmosphere: warm_romance
      line: "토요일 오후, 전날 들은 장소를 찾아간 한도윤은 회사 밖 차림의 동료 한 명과 마주쳤다. 취향이 겹칠 가능성이 현실이 된 듯했다."
    reality:
      atmosphere: procedural
      line: "토요일 오후, 공공장소에서 한도윤과 동료 한 명이 우연히 마주쳤다. 상대는 직장 동료를 만난 가벼운 놀람만 보였다."
      intent: courtesy
    next: activity_callback

  - id: activity_callback
    kind: dual_dialogue
    speaker: han_do_yoon
    perceived:
      atmosphere: warm_romance
      expression: subjective_confident
      line: "주말에도 뵙네요. 여기서 마주칠 줄은 몰랐습니다."
    reality:
      atmosphere: procedural
      expression: actual_waiting_smile
      line: "주말에도 뵙네요. 여기서 마주칠 줄은 몰랐습니다."
      intent: courtesy
    self_development_template:
      source: last_activity
      perceived:
        line: "{{weekend_pitch}}"
      reality:
        line: "{{weekend_pitch}}"
        intent: self_promotion
    next: activity_response

  - id: activity_response
    kind: dual_narration
    perceived:
      atmosphere: warm_romance
      line: "동료는 ‘여기서 뵐 줄은 몰랐네요’라고 인사했다."
    reality:
      atmosphere: procedural
      line: "동료는 ‘여기서 뵐 줄은 몰랐네요’라고 인사했다."
      intent: courtesy
    self_development_template:
      source: last_activity
      perceived:
        line: "동료는 ‘{{weekend_answer}} 저는 먼저 둘러볼게요.’라고 짧게 답했다."
      reality:
        line: "동료는 ‘{{weekend_answer}} 저는 먼저 둘러볼게요.’라고 짧게 답했다."
    next: activity_callback_inner

  - id: activity_callback_inner
    kind: dual_dialogue
    presentation_flags: [inner_voice]
    speakers:
      perceived: han_do_yoon
      reality:
    perceived:
      atmosphere: warm_romance
      line: "(회사 밖에서 마주친 걸 꽤 반가워하는군.)"
    reality:
      atmosphere: procedural
      line: "공공장소에서 직장 동료를 만난 가벼운 놀람이었다."
      intent: courtesy
    self_development_template:
      source: last_activity
      perceived:
        line: "(회사 밖에서도 내가 꺼낸 얘기에 바로 답해 주는군. {{perceived_self_image}})"
      reality:
        line: "{{reality_limit}} 동료는 눈앞의 질문이나 관찰에 답한 뒤 각자 둘러보기로 했다."
    next: goodbye

  - id: goodbye
    kind: dual_narration
    presentation_flags: [romance_insert]
    perceived:
      atmosphere: warm_romance
      line: "작별 인사는 ‘월요일에 뵙겠습니다. 다음에 또 봬요.’로 기억에 남았다."
    reality:
      atmosphere: procedural
      line: "실제로 들은 작별 인사는 ‘월요일에 뵙겠습니다.’였다."
      intent: courtesy
    next: goodbye_inner

  - id: goodbye_inner
    kind: dual_dialogue
    presentation_flags: [inner_voice]
    speakers:
      perceived: han_do_yoon
      reality:
    perceived:
      atmosphere: warm_romance
      line: (다음에 또 보자는 말까지 붙인 걸 보면, 오늘 마주친 게 싫지는 않았던 모양이야.)
    reality:
      atmosphere: procedural
      line: 한도윤은 실제 작별 인사 뒤에 짧은 한 문장을 덧붙여 기억했지만, 아직 연애 감정의 증거로 확정하지는 않았다.
      intent: courtesy
    next: leave

  - id: leave
    kind: exit
    transitions:
      - default: true
        scene: common.day_05_weekend_reflection
