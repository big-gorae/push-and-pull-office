- id: opens_signals_chapter
  kind: narration
  stage: []
  line: 일요일 밤, 이틀 연속 회사 동료와 마주친 일을 떠올리며 서정우가 책장을 넘겼다. 익숙한 강사의 목소리가 먼저 끼어들었다.
  next: do_yoon_wonders

- id: do_yoon_wonders
  kind: dialogue
  speaker: han_do_yoon
  stage: []
  expression: actual_waiting_smile
