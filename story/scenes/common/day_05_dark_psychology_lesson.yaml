  expression: decisive_point
  line: 호감인지 우연인지 헷갈리는 당신! 1.2 당신에게 호감이 있는 여성이 절대 숨길 수 없는 시그널, 이 장을 읽어 보시라~!
  next: instructor_lists_signals_one

- id: instructor_lists_signals_one
  kind: dialogue
  speaker: dark_psychology_instructor
  stage:
  - position: center
    character: dark_psychology_instructor
    visual_id: character.dark_psychology_instructor
    artwork: default
  expression: authoritative_smirk
  line: 머리를 자주 묶고, 선물을 지니고 다니고, 당신의 작은 개인사나 사소한 말을 기억한다면 호감 시그널입니다.
  next: instructor_lists_signals_two

- id: instructor_lists_signals_two
  kind: dialogue
  speaker: dark_psychology_instructor
  stage:
  - position: center
    character: dark_psychology_instructor
    visual_id: character.dark_psychology_instructor
    artwork: default
  expression: decisive_point
  line: 장난을 치거나 다른 남자 이야기로 질투를 유발하고, 일상을 공유하고, 굳이 가까이 앉고, 작은 접촉을 만드는 것도 절대 숨길 수 없는 시그널입니다.
  next: do_yoon_decides

