schema_version: 1
id: common.day_01_company_meeting
title: 수요일의 첫 회의
route: seo_a
chapter: 0
sequence: 1
location: meeting_room
time: morning
purpose: 프로젝트 킥오프에서 서아·민경·유진의 업무 태도와 한도윤의 첫인상을 보여 주되 아직 누구도 연애 후보로 확정하지 않는다.
cast:
  - han_do_yoon
  - yoon_seo_a
  - cha_min_kyung
  - kang_yoo_jin
world_context:
  company: company.dawon_living
  project: project.harudam_spring_campaign
  interaction: meeting.cross_function_kickoff
  participants:
    - member.han_do_yoon
    - member.yoon_seo_a
    - member.cha_min_kyung
    - member.kang_yoo_jin
    - member.oh_se_jin
    - member.jeong_da_eun
    - member.moon_ji_hye
entry_conditions: []
state_contract:
  reads: []
  writes: []
start_node: arrival
nodes:
  - id: arrival
    kind: narration
    line: "(수요일 오전, 새 프로젝트의 첫 회의가 시작됐다. 과연 어떤 사람들과 일하게 될까나..)"
    next: jeong_da_eun_opening

  - id: jeong_da_eun_opening
    kind: dialogue
    speaker: member.jeong_da_eun
    stage: []
    line: "오 차장님과 문 부장님까지 오셨으니, 시작하겠습니다"
    next: oh_se_jin_scope

  - id: oh_se_jin_scope
    kind: dialogue
    speaker: member.jeong_da_eun
    stage: []
    line: "오전에 공유드린 “봄 맞이 홈카페 라인\" 문서 5 페이지 부터 보시면 됩니다"
    next: seo_a_materials
  - id: seo_a_materials
    kind: dialogue
    speaker: yoon_seo_a
    stage:
      - artwork: default
        character: yoon_seo_a
        position: center
        visual_id: character.yoon_seo_a
    expression: actual_social_smile
    line: "과장님, 이걸로 먼저 보세요. 저는 화면으로 봐도 돼요."
    next: do_yoon_thanks

  - id: do_yoon_thanks
    kind: dialogue
    speaker: han_do_yoon
    stage: []
    expression: actual_waiting_smile
    line: "고마워요, 윤서아 씨. 한 부가 부족한 걸 바로 챙겨 줬네요. 저는 이걸로 보고, 추가 출력은 회의 끝나고 해도 됩니다."
    next: seo_a_introduction

  - id: seo_a_introduction
    kind: dialogue
    speaker: yoon_seo_a
    stage:
      - artwork: default
        character: yoon_seo_a
        position: center
        visual_id: character.yoon_seo_a
    expression: actual_social_smile
    line: "아, 네. 감사합니다. 지금은 회의에 집중하고, 빠진 자료는 끝나고 제가 확인할게요."
    next: min_kyung_question

  - id: min_kyung_question
    kind: dialogue
    speaker: cha_min_kyung
    stage:
      - artwork: default
        character: cha_min_kyung
        position: center
        visual_id: character.cha_min_kyung
    expression: actual_skeptical
    line: "한 과장님, 백화점 바이어 1차 승인까지 사흘로 잡혀 있습니다. 지난 분기 기준으로 가능한 일정입니까?"
    next: do_yoon_answer

  - id: do_yoon_answer
    kind: dialogue
    speaker: han_do_yoon
    stage: []
    expression: actual_waiting_smile
    line: "이번에는 사전 검토를 먼저 받았습니다. 회신 기한도 어제 메일로 확인했고요."
    next: min_kyung_accepts

  - id: min_kyung_accepts
    kind: dialogue
    speaker: cha_min_kyung
    stage:
      - artwork: default
        character: cha_min_kyung
        position: center
        visual_id: character.cha_min_kyung
    expression: actual_skeptical
    line: "그 조건까지 확인하셨다면 괜찮겠네요. 계속하시죠."
    next: yoo_jin_correction

  - id: yoo_jin_correction
    kind: dialogue
    speaker: kang_yoo_jin
    stage:
      - artwork: default
        character: kang_yoo_jin
        position: center
        visual_id: character.kang_yoo_jin
    expression: actual_fact_check
    line: "한 과장님, 홈카페 키 비주얼은 네 종이 아니라 세 종입니다. 최종안 한 종과 팝업·인플루언서용 변형 두 종입니다."
    next: do_yoon_accepts_correction

  - id: do_yoon_accepts_correction
    kind: dialogue
    speaker: han_do_yoon
    stage: []
    expression: actual_waiting_smile
    line: "확인했습니다. 회의록에는 세 종으로 정리하죠. 수정된 시각도 같이 남겨 주세요."
    next: yoo_jin_timestamp

  - id: yoo_jin_timestamp
    kind: dialogue
    speaker: kang_yoo_jin
    stage:
      - artwork: default
        character: kang_yoo_jin
        position: center
        visual_id: character.kang_yoo_jin
    expression: actual_procedural
    line: "오늘 오전 8시 42분에 수정했습니다. 공유 문서에도 같은 내용으로 반영했습니다."
    next: moon_ji_hye_capacity

  - id: moon_ji_hye_capacity
    kind: dialogue
    speaker: member.moon_ji_hye
    stage: []
    line: "브랜드마케팅팀은 세 종 기준으로 제작 시간을 확보했습니다. 제품 사양과 문구가 확정되면 강유진 대리에게 넘겨 주세요."
    next: assignments
  - id: assignments
    kind: narration
    line: "참석자들은 바이어 승인, 제품 자료, 캠페인 일정과 제작 파일을 담당별로 나눴다."
    next: seo_a_closing

  - id: seo_a_closing
    kind: dialogue
    speaker: yoon_seo_a
    stage:
      - artwork: default
        character: yoon_seo_a
        position: center
        visual_id: character.yoon_seo_a
    expression: actual_social_smile
    line: "회의록 초안은 점심 전까지 공유하겠습니다. 빠진 자료도 같이 올려둘게요."
    next: min_kyung_closing

  - id: min_kyung_closing
    kind: dialogue
    speaker: cha_min_kyung
    stage:
      - artwork: default
        character: cha_min_kyung
        position: center
        visual_id: character.cha_min_kyung
    expression: actual_skeptical
    line: "승인 회신이 오면 일정표부터 다시 맞추겠습니다. 확인 메일은 저도 참조해 주세요."
    next: yoo_jin_closing

  - id: yoo_jin_closing
    kind: dialogue
    speaker: kang_yoo_jin
    stage:
      - artwork: default
        character: kang_yoo_jin
        position: center
        visual_id: character.kang_yoo_jin
    expression: actual_procedural
    line: "수치가 바뀌면 브랜드마케팅팀 제작 파일에도 같은 버전으로 반영해 주세요. 이전 파일은 사용하지 않겠습니다."
    next: do_yoon_closing

  - id: do_yoon_closing
    kind: dialogue
    speaker: han_do_yoon
    stage: []
    expression: actual_waiting_smile
    line: "좋습니다. 첫 주는 일정부터 맞추죠. 불편한 건 부담 갖지 말고 바로 말해요."
    next: after_meeting

  - id: after_meeting
    kind: narration
    line: "회의가 끝나자 세 사람은 각자 맡은 업무로 돌아갔다. 누구도 한도윤에게 사적인 관심을 표현하지 않았다."
    next: leave

  - id: leave
    kind: exit
    transitions:
      - default: true
        scene: common.day_01_parent_pressure
