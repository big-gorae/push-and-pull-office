schema_version: 1
id: common.day_01_company_meeting
title: 수요일의 첫 회의
route: seo_a
chapter: 0
sequence: 1
location: meeting_room
time: morning
purpose: 프로젝트 킥오프에서 서아·민경·유진의 업무 태도와 한도윤의 첫인상을 보여 주되 아직 누구도 연애 후보로 확정하지 않는다.
cast: [han_do_yoon, yoon_seo_a, cha_min_kyung, kang_yoo_jin]
entry_conditions: []
state_contract:
  reads: []
  writes: []
start_node: arrival
nodes:
  - id: arrival
    kind: dual_narration
    perceived:
      atmosphere: procedural
      line: "수요일 오전, 새 프로젝트의 첫 회의가 시작됐다. 낯선 팀이 한자리에 모이면 사람의 장점도 평소보다 선명하게 보이는 법이다."
      protagonist_interpretation: 새 프로젝트는 자신의 능력을 보여 주고 새로운 사람을 알아갈 기회라고 생각한다.
    reality:
      atmosphere: procedural
      line: "수요일 오전, 영업기획·상품기획·마케팅·브랜드디자인 실무자들이 신규 프로젝트 킥오프를 위해 회의실에 모였다."
      inner_thought: 참석자들은 배포 자료와 일정표를 확인하며 각자 맡을 업무를 준비한다.
      intent: work_only
    next: seo_a_materials

  - id: seo_a_materials
    kind: dual_dialogue
    speaker: yoon_seo_a
    perceived:
      atmosphere: warm_romance
      expression: subjective_shy
      line: "과장님, 이걸로 먼저 보세요. 저는 화면으로 봐도 돼요."
      protagonist_interpretation: 자신의 자료가 빠진 것을 가장 먼저 알아채고 개인 몫까지 내어 준 세심한 배려라고 느낀다.
    reality:
      atmosphere: procedural
      expression: actual_social_smile
      line: "과장님, 이걸로 먼저 보세요. 저는 화면으로 봐도 돼요."
      inner_thought: 배포 부수가 하나 부족하다. 준비 담당자인 내가 화면을 보면 회의를 늦추지 않을 수 있다.
      intent: work_only
    next: do_yoon_thanks

  - id: do_yoon_thanks
    kind: dual_dialogue
    speaker: han_do_yoon
    perceived:
      atmosphere: procedural
      expression: subjective_confident
      line: "고마워요. 윤서아 씨 맞죠? 출력은 회의 끝나고 해도 됩니다."
      protagonist_interpretation: 긴장한 신입에게 이름을 불러 주며 여유 있게 부담을 덜어 준다고 생각한다.
    reality:
      atmosphere: procedural
      expression: actual_waiting_smile
      line: "고마워요. 윤서아 씨 맞죠? 출력은 회의 끝나고 해도 됩니다."
      inner_thought: 사원증에서 이름을 확인했다. 자료가 생겼으니 회의를 시작하면 된다.
      intent: courtesy
    next: seo_a_introduction

  - id: seo_a_introduction
    kind: dual_dialogue
    speaker: yoon_seo_a
    perceived:
      atmosphere: procedural
      expression: subjective_shy
      line: "아, 네. 상품기획팀 윤서아입니다. 빠진 자료는 회의 끝나고 바로 출력해 둘게요."
      protagonist_interpretation: 이름을 기억해 준 것이 반가워 자신을 다시 또렷하게 소개한다고 받아들인다.
    reality:
      atmosphere: procedural
      expression: actual_social_smile
      line: "아, 네. 상품기획팀 윤서아입니다. 빠진 자료는 회의 끝나고 바로 출력해 둘게요."
      inner_thought: 첫 회의부터 준비 실수로 보이지 않게 부족한 자료를 보충해야 한다.
      intent: work_only
    next: min_kyung_question

  - id: min_kyung_question
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: playful_tension
      expression: subjective_challenging
      line: "한 과장님, 거래처 1차 승인까지 사흘로 잡혀 있습니다. 지난 분기 기준으로 가능한 일정입니까?"
      protagonist_interpretation: 회의의 핵심을 곧바로 찌르며 자신의 실력을 확인하려는 도전이라고 느낀다.
    reality:
      atmosphere: procedural
      expression: actual_skeptical
      line: "한 과장님, 거래처 1차 승인까지 사흘로 잡혀 있습니다. 지난 분기 기준으로 가능한 일정입니까?"
      inner_thought: 승인 지연이 전체 제작 일정을 무너뜨릴 수 있으니 근거를 지금 확인해야 한다.
      intent: documentation
    next: do_yoon_answer

  - id: do_yoon_answer
    kind: dual_dialogue
    speaker: han_do_yoon
    perceived:
      atmosphere: playful_tension
      expression: subjective_confident
      line: "이번에는 사전 검토를 먼저 받았습니다. 회신 기한도 어제 메일로 확인했고요."
      protagonist_interpretation: 상대가 던진 까다로운 질문에 준비된 답을 내놓으며 주도권을 잡았다고 생각한다.
    reality:
      atmosphere: procedural
      expression: actual_waiting_smile
      line: "이번에는 사전 검토를 먼저 받았습니다. 회신 기한도 어제 메일로 확인했고요."
      inner_thought: 일정 근거는 준비되어 있다. 확인 메일을 공유하면 논의를 빨리 끝낼 수 있다.
      intent: documentation
    next: min_kyung_accepts

  - id: min_kyung_accepts
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: procedural
      expression: subjective_challenging
      line: "그 조건까지 확인하셨다면 괜찮겠네요. 계속하시죠."
      protagonist_interpretation: 자신을 시험한 뒤 실력을 인정하고 한발 물러난 반응처럼 느낀다.
    reality:
      atmosphere: procedural
      expression: actual_skeptical
      line: "그 조건까지 확인하셨다면 괜찮겠네요. 계속하시죠."
      inner_thought: 일정 근거가 있으니 이 안건에 시간을 더 쓸 필요는 없다.
      intent: work_only
    next: yoo_jin_correction

  - id: yoo_jin_correction
    kind: dual_dialogue
    speaker: kang_yoo_jin
    perceived:
      atmosphere: playful_tension
      expression: subjective_bold_flirt
      line: "한 과장님, 디자인 시안은 네 종이 아니라 세 종입니다. 최종안 한 종과 매체별 변형 두 종입니다."
      protagonist_interpretation: 회의 내내 자신을 지켜보다 사소한 오류를 빌미로 대화에 끼어든 당돌한 관심이라고 여긴다.
    reality:
      atmosphere: procedural
      expression: actual_fact_check
      line: "한 과장님, 디자인 시안은 네 종이 아니라 세 종입니다. 최종안 한 종과 매체별 변형 두 종입니다."
      inner_thought: 잘못된 수량이 회의록과 발주 문서에 남기 전에 바로잡아야 한다.
      intent: documentation
    next: do_yoon_accepts_correction

  - id: do_yoon_accepts_correction
    kind: dual_dialogue
    speaker: han_do_yoon
    perceived:
      atmosphere: procedural
      expression: subjective_confident
      line: "확인했습니다. 회의록에는 세 종으로 정리하죠. 수정된 시각도 같이 남겨 주세요."
      protagonist_interpretation: 지적을 넉넉하게 받아 주면서 오히려 더 꼼꼼한 기준을 제시했다고 생각한다.
    reality:
      atmosphere: procedural
      expression: actual_waiting_smile
      line: "확인했습니다. 회의록에는 세 종으로 정리하죠. 수정된 시각도 같이 남겨 주세요."
      inner_thought: 수량 오류를 인정하고 변경 기록을 남기는 편이 업무상 안전하다.
      intent: documentation
    next: yoo_jin_timestamp

  - id: yoo_jin_timestamp
    kind: dual_dialogue
    speaker: kang_yoo_jin
    perceived:
      atmosphere: procedural
      expression: subjective_bold_flirt
      line: "오늘 오전 8시 42분에 수정했습니다. 공유 문서에도 같은 내용으로 반영했습니다."
      protagonist_interpretation: 자신의 주문을 기다렸다는 듯 정확한 답을 내놓는 모습에서 좋은 호흡을 느낀다.
    reality:
      atmosphere: procedural
      expression: actual_procedural
      line: "오늘 오전 8시 42분에 수정했습니다. 공유 문서에도 같은 내용으로 반영했습니다."
      inner_thought: 날짜와 시각까지 말하면 이후 버전 혼선을 막을 수 있다.
      intent: documentation
    next: assignments

  - id: assignments
    kind: dual_narration
    perceived:
      atmosphere: procedural
      line: "서아는 세심했고, 민경은 정확했으며, 유진은 거리낌이 없었다. 첫 회의치고는 각자의 색이 분명한 팀이었다."
      protagonist_interpretation: 세 사람이 자신 앞에서 서로 다른 장점을 드러냈다고 기억한다.
    reality:
      atmosphere: procedural
      line: "서아는 회의록과 자료 보충을, 민경은 승인 일정 검증을, 유진은 디자인 버전 관리를 맡았다."
      inner_thought: 참석자들은 정해진 역할을 확인하고 남은 안건을 처리한다.
      intent: work_only
    next: seo_a_closing

  - id: seo_a_closing
    kind: dual_dialogue
    speaker: yoon_seo_a
    perceived:
      atmosphere: procedural
      expression: subjective_shy
      line: "회의록 초안은 점심 전까지 공유하겠습니다. 빠진 자료도 같이 올려둘게요."
      protagonist_interpretation: 자신의 불편을 끝까지 챙기려는 책임감 있는 배려라고 받아들인다.
    reality:
      atmosphere: procedural
      expression: actual_social_smile
      line: "회의록 초안은 점심 전까지 공유하겠습니다. 빠진 자료도 같이 올려둘게요."
      inner_thought: 담당한 두 가지 일을 한 번에 처리하면 된다.
      intent: work_only
    next: min_kyung_closing

  - id: min_kyung_closing
    kind: dual_dialogue
    speaker: cha_min_kyung
    perceived:
      atmosphere: procedural
      expression: subjective_challenging
      line: "승인 회신이 오면 일정표부터 다시 맞추겠습니다. 확인 메일은 저도 참조해 주세요."
      protagonist_interpretation: 자신의 판단을 신뢰하되 다음 움직임은 함께 맞추겠다는 동료다운 제안으로 느낀다.
    reality:
      atmosphere: procedural
      expression: actual_skeptical
      line: "승인 회신이 오면 일정표부터 다시 맞추겠습니다. 확인 메일은 저도 참조해 주세요."
      inner_thought: 회신을 직접 확인해야 일정 책임자로서 변경을 관리할 수 있다.
      intent: documentation
    next: yoo_jin_closing

  - id: yoo_jin_closing
    kind: dual_dialogue
    speaker: kang_yoo_jin
    perceived:
      atmosphere: procedural
      expression: subjective_bold_flirt
      line: "수치가 바뀌면 디자인팀에도 같은 버전으로 전달해 주세요. 이전 파일은 사용하지 않겠습니다."
      protagonist_interpretation: 자신과 기준을 맞춰 일하겠다는 단호한 약속처럼 들린다.
    reality:
      atmosphere: procedural
      expression: actual_procedural
      line: "수치가 바뀌면 디자인팀에도 같은 버전으로 전달해 주세요. 이전 파일은 사용하지 않겠습니다."
      inner_thought: 잘못된 파일이 다시 유통되지 않도록 전달 경로를 분명히 한다.
      intent: documentation
    next: do_yoon_closing

  - id: do_yoon_closing
    kind: dual_dialogue
    speaker: han_do_yoon
    perceived:
      atmosphere: procedural
      expression: subjective_confident
      line: "좋습니다. 첫 주는 일정부터 맞추죠. 불편한 건 부담 갖지 말고 바로 말해요."
      protagonist_interpretation: 서로 다른 성격의 팀원들을 편안하게 이끄는 믿음직한 책임자로 회의를 마쳤다고 생각한다.
    reality:
      atmosphere: procedural
      expression: actual_waiting_smile
      line: "좋습니다. 첫 주는 일정부터 맞추죠. 불편한 건 부담 갖지 말고 바로 말해요."
      inner_thought: 첫 회의에서는 의견을 열어 두는 상사처럼 보이는 편이 좋다.
      intent: work_only
    next: after_meeting

  - id: after_meeting
    kind: dual_narration
    perceived:
      atmosphere: procedural
      line: "첫인상은 나쁘지 않았다. 다만 아직은 함께 일하게 된 사람들의 얼굴과 이름을 익힌 정도였다."
      protagonist_interpretation: 세 사람의 매력을 눈여겨보지만 누구를 사적으로 알아가겠다는 생각까지는 하지 않는다.
    reality:
      atmosphere: procedural
      line: "회의가 끝나자 세 사람은 각자 맡은 업무로 돌아갔다. 누구도 한도윤에게 사적인 관심을 표현하지 않았다."
      inner_thought: 한도윤은 업무에 필요한 것보다 조금 오래 세 사람의 인상을 정리하지만 아직 행동으로 옮기지는 않는다.
      intent: work_only
    next: leave

  - id: leave
    kind: exit
    transitions:
      - default: true
        scene: common.day_01_parent_pressure
