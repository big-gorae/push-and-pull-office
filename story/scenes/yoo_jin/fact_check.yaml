schema_version: 1
id: yoo_jin.fact_check
title: 그런 일은 없었습니다
route: yoo_jin
chapter: 1
sequence: 10
location: office_corridor
time: afternoon
purpose: 유진이 주인공의 기억을 즉시 반박해 원문 고정 시스템을 보여준다.
cast: [han_do_yoon, kang_yoo_jin]
entry_conditions:
  - {path: progress.cleared_routes, op: contains, value: seo_a}
  - {path: progress.cleared_routes, op: contains, value: min_kyung}
state_contract:
  reads:
    - progress.cleared_routes
  writes:
    - visible.heroines.kang_yoo_jin.affection
    - visible.heroines.kang_yoo_jin.initiative
    - visible.heroines.kang_yoo_jin.perceived_state
    - hidden.heroines.kang_yoo_jin.suspicion
    - hidden.heroines.kang_yoo_jin.dislike
    - hidden.heroines.kang_yoo_jin.evidence_count
start_node: correction
nodes:
  - id: correction
    kind: dual_dialogue
    speaker: kang_yoo_jin
    presentation_flags: [original_text_lock]
    perceived:
      atmosphere: playful_tension
      expression: subjective_bold_flirt
      line: "둘이 있었던 적은 없어요. 김 대리도 함께 있었죠."
      protagonist_interpretation: 자신의 관심을 인정하기 싫어 사실관계까지 따지는 당돌한 밀기다.
    reality:
      atmosphere: procedural
      expression: actual_fact_check
      line: "둘이 있었던 적 없습니다. 김 대리도 함께 있었습니다."
      inner_thought: 사실을 바꿔 말하는 습관이 있다. 날짜와 참석자를 남겨 둔다.
      intent: documentation
    next: respond

  - id: respond
    kind: choice
    prompt: 해석을 거부하는 유진에게 어떻게 대응할까?
    options:
      - id: strategic_retreat
        label: 한 번 밀어준다
        interpretation: 쉽게 흔들리지 않는 상대에게 생각할 시간을 준다.
        action: 대화를 중단하고 자리를 떠난다.
        conditions: []
        effects:
          - {path: visible.heroines.kang_yoo_jin.affection, op: add, value: 5}
          - {path: visible.heroines.kang_yoo_jin.initiative, op: add, value: 5}
          - {path: visible.heroines.kang_yoo_jin.perceived_state, op: set, value: push}
          - {path: hidden.heroines.kang_yoo_jin.suspicion, op: add, value: -1}
          - {path: hidden.heroines.kang_yoo_jin.dislike, op: add, value: 1}
        next: leave
      - id: reinterpret_correction
        label: 팩트 뒤의 감정을 짚어준다
        interpretation: 세세한 반박 자체가 자신을 의식한다는 증거라고 말한다.
        action: 유진의 업무용 메신저로 사적인 해석을 다시 전달한다.
        conditions: []
        effects:
          - {path: visible.heroines.kang_yoo_jin.affection, op: add, value: 12}
          - {path: visible.heroines.kang_yoo_jin.initiative, op: add, value: 8}
          - {path: visible.heroines.kang_yoo_jin.perceived_state, op: set, value: pull}
          - {path: hidden.heroines.kang_yoo_jin.suspicion, op: add, value: 12}
          - {path: hidden.heroines.kang_yoo_jin.dislike, op: add, value: 15}
          - {path: hidden.heroines.kang_yoo_jin.evidence_count, op: add, value: 1}
        next: leave
      - id: accept_fact
        label: 사실관계를 인정한다
        interpretation: 이번 대화에 연애적 의미를 부여하지 않는다.
        action: 자신의 표현이 틀렸음을 인정하고 사과한 뒤 떠난다.
        conditions: []
        effects:
          - {path: visible.heroines.kang_yoo_jin.affection, op: add, value: -10}
          - {path: visible.heroines.kang_yoo_jin.initiative, op: add, value: -10}
          - {path: visible.heroines.kang_yoo_jin.perceived_state, op: set, value: neutral}
          - {path: hidden.heroines.kang_yoo_jin.suspicion, op: add, value: -3}
        next: leave

  - id: leave
    kind: exit
    transitions:
      - default: true
        scene: yoo_jin.formal_record
