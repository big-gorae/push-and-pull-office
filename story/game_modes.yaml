schema_version: 1
id: game_modes
modes:
  base:
    campaign_id: main
    continuity_id: main
    content_status: playable
    unlock:
      always: true

  survivor_view:
    campaign_id:
    planned_campaign_id: survivor
    continuity_id: survivor
    content_status: coming_soon
    unlock:
      any:
      - conditions:
        - {path: progress.cleared_routes, op: contains, value: seo_a}
      - conditions:
        - {path: progress.cleared_routes, op: contains, value: yoo_jin}
