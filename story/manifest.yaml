schema_version: 1
project:
  id: love_office_story_1
  title: 밀당 오피스 - 초필살 다크 스킬로 그녀의 마음을 캐에에에에엣치 존잘 중년 이야기
  default_language: ko
  supported_languages: [ko, en]

id_pattern: "^[a-z][a-z0-9_.]*$"

enums:
  perceived_state: [push, pull, neutral]
  time_slot: [morning, lunch, afternoon, after_work]
  event_type: [anchor, heroine, company, offscreen, ending]
  event_availability: [automatic, player, hidden]
  event_completion: [return_to_timeline, honor_scene_exit]
  presentation_flag: [original_text_lock, ui_glitch, ui_label_reveal, auditory_distortion, romance_insert, inner_voice]
  visual_kind: [background_archetype, background, character_archetype, character]
  render_strategy: [flat_portrait, layered_sprite, background]
  stage_position: [far_left, left, center, right, far_right]
  atmosphere:
    - warm_romance
    - playful_tension
    - cold_office
    - guarded_office
    - procedural
    - dread
  intent:
    - courtesy
    - boundary
    - avoidance
    - relief
    - documentation
    - confrontation
    - self_protection
    - self_promotion
    - work_only
  node_kind:
    - dual_dialogue
    - dual_narration
    - choice
    - state_gate
    - effect
    - exit

stats:
  visible.protagonist.self_development.appeal:
    type: integer
    min: 0
    max: 100
    description: 한도윤이 스스로 평가하는 매력도
  visible.protagonist.self_development.stats.health:
    type: integer
    min: 0
    max: 5
    description: 운동과 생활 관리 관련 대화 표현을 여는 건강
  visible.protagonist.self_development.stats.appearance:
    type: integer
    min: 0
    max: 5
    description: 자기관리 관련 대화 표현을 여는 외모 관리
  visible.protagonist.self_development.stats.humor:
    type: integer
    min: 0
    max: 5
    description: 가벼운 농담 표현을 여는 유머 감각
  visible.protagonist.self_development.stats.intelligence:
    type: integer
    min: 0
    max: 5
    description: 독서와 업무 맥락 관련 대화 표현을 여는 지성
  visible.protagonist.self_development.fatigue:
    type: integer
    min: 0
    max: 6
    description: 밤 활동과 고급 표현 사용을 제한하는 피로도
  visible.affection:
    type: integer
    min: 0
    max: 100
    description: 주인공이 사랑받는다고 확신하는 정도
  visible.initiative:
    type: integer
    min: 0
    max: 100
    description: 주인공이 밀당을 통제한다고 믿는 정도
  visible.perceived_state:
    type: enum
    values: [push, pull, neutral]
    description: 주인공이 해석한 상대의 현재 상태
  hidden.suspicion:
    type: integer
    min: 0
    max: 100
    description: 의도적 접근이나 위험을 의심하는 정도
  hidden.dislike:
    type: integer
    min: 0
    max: 100
    description: 쉽게 회복되지 않는 누적 거부감
  hidden.evidence_count:
    type: integer
    min: 0
    max: 99
    description: 제시 가능한 물리적 증거의 개수
  progress.time.day:
    type: integer
    min: 1
    max: 17
    description: 현재 캠페인 날짜
  progress.time.act:
    type: integer
    min: 1
    max: 3
    description: 현재 이야기 막
  progress.time.slot:
    type: enum
    values: [morning, lunch, afternoon, after_work]
    description: 현재 시간대

state_path_patterns:
  - pattern: "^visible\\.protagonist\\.self_development\\.(appeal|fatigue)$"
    stat_from_path: true
  - pattern: "^visible\\.protagonist\\.self_development\\.stats\\.(health|appearance|humor|intelligence)$"
    stat_from_path: true
  - pattern: "^visible\\.heroines\\.[a-z][a-z0-9_]*\\.(affection|initiative|perceived_state)$"
    stat_from_suffix: true
  - pattern: "^hidden\\.heroines\\.[a-z][a-z0-9_]*\\.(suspicion|dislike|evidence_count)$"
    stat_from_suffix: true
  - pattern: "^progress\\.(cleared_routes|unlocked_modes)$"
    type: array
  - pattern: "^progress\\.flags$"
    type: map
  - pattern: "^progress\\.flags\\.[a-z][a-z0-9_.]*$"
    type: any
  - pattern: "^progress\\.time\\.(day|act|slot)$"
    stat_from_path: true
  - pattern: "^progress\\.events\\.(seen|missed|expired)$"
    type: array
  - pattern: "^progress\\.memories$"
    type: array
  - pattern: "^progress\\.self_development\\.(completed_days|activity_history)$"
    type: array
  - pattern: "^progress\\.self_development\\.last_activity$"
    type: string

initial_state:
  visible:
    protagonist:
      self_development:
        appeal: 30
        stats:
          health: 0
          appearance: 0
          humor: 0
          intelligence: 0
        fatigue: 1
    heroines:
      yoon_seo_a:
        affection: 5
        initiative: 50
        perceived_state: neutral
      cha_min_kyung:
        affection: 5
        initiative: 50
        perceived_state: neutral
      kang_yoo_jin:
        affection: 0
        initiative: 30
        perceived_state: neutral
  hidden:
    heroines:
      yoon_seo_a:
        suspicion: 0
        dislike: 0
        evidence_count: 0
      cha_min_kyung:
        suspicion: 0
        dislike: 10
        evidence_count: 0
      kang_yoo_jin:
        suspicion: 35
        dislike: 15
        evidence_count: 0
  progress:
    time:
      day: 1
      act: 1
      slot: morning
    events:
      seen: []
      missed: []
      expired: []
    memories: []
    cleared_routes: []
    unlocked_modes: [base]
    self_development:
      completed_days: []
      activity_history: []
      last_activity: ""
    flags:
      push_pull:
        combo: 0
        position: 0
        target: none
        last_action: none
        heroine: ""
      story_mode:
        target: none
        day_02_response: none
        final_interpretation: undecided
        home_incident: none
        yoo_jin_intervention: false

self_development:
  max_night_day: 16
  activities:
    - id: workout
      title_key: selfDevelopment.activity.workout.title
      description_key: selfDevelopment.activity.workout.description
      reflection_keys:
        perceived: selfDevelopment.activity.workout.reflection.perceived
        reality: selfDevelopment.activity.workout.reflection.reality
      appeal_delta: 3
      fatigue_delta: 2
      stat_deltas: {health: 2, appearance: 1}
      fatigue_lte: 4
    - id: reading
      title_key: selfDevelopment.activity.reading.title
      description_key: selfDevelopment.activity.reading.description
      reflection_keys:
        perceived: selfDevelopment.activity.reading.reflection.perceived
        reality: selfDevelopment.activity.reading.reflection.reality
      appeal_delta: 1
      fatigue_delta: 1
      stat_deltas: {intelligence: 2}
      fatigue_lte: 5
    - id: ott
      title_key: selfDevelopment.activity.ott.title
      description_key: selfDevelopment.activity.ott.description
      reflection_keys:
        perceived: selfDevelopment.activity.ott.reflection.perceived
        reality: selfDevelopment.activity.ott.reflection.reality
      appeal_delta: -1
      fatigue_delta: -1
      stat_deltas: {humor: 2}
    - id: sleep
      title_key: selfDevelopment.activity.sleep.title
      description_key: selfDevelopment.activity.sleep.description
      reflection_keys:
        perceived: selfDevelopment.activity.sleep.reflection.perceived
        reality: selfDevelopment.activity.sleep.reflection.reality
      appeal_delta: 0
      fatigue_delta: -4
      stat_deltas: {}
    - id: solo_drinking
      title_key: selfDevelopment.activity.solo_drinking.title
      description_key: selfDevelopment.activity.solo_drinking.description
      reflection_keys:
        perceived: selfDevelopment.activity.solo_drinking.reflection.perceived
        reality: selfDevelopment.activity.solo_drinking.reflection.reality
      selectable: false
      appeal_delta: -1
      fatigue_delta: -2
      stat_deltas: {health: -1}
      fatigue_gte: 5
  conversation_topics:
    workout:
      variant_id: after_workout
      expression: feedback.last_workout
      slots:
        office_pitch: "요즘 운동을 다시 시작했습니다. 앉아 있는 시간이 길어서 건강부터 챙기려고요."
        weekend_pitch: "요즘 운동을 다시 시작했습니다. 주말에는 가볍게 걷는 것도 괜찮더군요. 이 근처도 산책하기 괜찮나요?"
        acknowledgement: "운동을 다시 시작하셨군요."
        weekend_answer: "이 근처는 차가 많지 않아 걷기 괜찮은 편이에요."
        perceived_self_image: "꾸준히 자기관리하는 사람이라는 인상은 남았겠지."
        reality_response_thought: "과장님이 운동을 다시 시작했다는 말을 먼저 꺼내셨네."
        reality_limit: "한 번 운동했다는 자기보고일 뿐, 외형이나 건강의 변화가 확인된 것은 아니었다."
    reading:
      variant_id: after_reading
      expression: feedback.last_reading
      slots:
        office_pitch: "요즘 《말보다 맥락》이라는 책을 읽고 있습니다. 상대가 정한 선을 먼저 이해해야 대화도 된다는 대목이 기억에 남더군요."
        weekend_pitch: "요즘 《말보다 맥락》이라는 책을 읽고 있습니다. 주말에 조용히 읽을 곳을 찾고 있었는데, 이 근처도 괜찮습니까?"
        acknowledgement: "요즘 책을 읽고 계시는군요."
        weekend_answer: "조용히 읽으려면 안쪽 자리가 괜찮아요."
        perceived_self_image: "말의 맥락까지 읽는 사람이라는 인상은 남았겠지."
        reality_response_thought: "과장님이 전날 읽은 책을 대화 소재로 먼저 꺼내셨네."
        reality_limit: "책 한 권을 읽기 시작했다는 자기보고일 뿐, 상대를 더 잘 이해하게 됐다는 증거는 아니었다."
    ott:
      variant_id: after_ott
      expression: feedback.last_ott
      slots:
        office_pitch: "요즘 다들 《퇴근은 내일》이라는 회사 코미디를 본다면서요? 저도 어제 몇 편 봤습니다. 요즘 화제 정도는 알아둬야 할 것 같아서요."
        weekend_pitch: "요즘 다들 《퇴근은 내일》이라는 회사 코미디를 본다면서요? 저도 어제 몇 편 봤습니다. ‘회의는 끝났지만 내 마음은 야근 중입니다’라는 대사는 원래 어느 장면에 나옵니까?"
        acknowledgement: "《퇴근은 내일》을 보셨군요."
        weekend_answer: "그 대사는 첫 회 회식 장면에 나와요."
        perceived_self_image: "세대가 다른 사람과도 화제를 맞출 줄 안다는 인상은 남았겠지."
        reality_response_thought: "과장님이 전날 본 코미디를 대화 소재로 먼저 꺼내셨네."
        reality_limit: "대중적인 콘텐츠를 뒤늦게 봤다는 말일 뿐, 서로 잘 통한다는 증거는 아니었다."
    sleep:
      variant_id: after_sleep
      expression: feedback.last_sleep
      slots:
        office_pitch: "요즘은 늦게까지 깨어 있는 시간을 줄이고 아침 컨디션을 챙겨 보려고 합니다. 집중력 관리도 실력이라고 생각해서요."
        weekend_pitch: "요즘은 늦게까지 깨어 있는 시간을 줄이고 아침 컨디션을 챙겨 보려고 합니다. 일찍 움직이니 한결 여유롭네요."
        acknowledgement: "생활 리듬을 챙기시는군요."
        weekend_answer: "주말에는 조금 일찍 움직이면 여유 있게 둘러볼 수 있죠."
        perceived_self_image: "자기 리듬을 관리할 줄 아는 사람으로 보였겠지."
        reality_response_thought: "과장님이 생활 리듬을 챙겨 보겠다는 말을 먼저 꺼내셨네."
        reality_limit: "생활 리듬을 챙겨 보겠다는 자기보고일 뿐, 지속적인 자기관리의 증거는 아니었다."
    solo_drinking:
      variant_id: after_solo_drinking
      expression: feedback.last_solo_drinking
      slots:
        office_pitch: "어제는 너무 피곤해서 혼자 한잔하고 바로 잤습니다. 오늘은 정신을 좀 차려야겠군요."
        weekend_pitch: "어제는 너무 피곤해서 혼자 한잔하고 바로 잤습니다. 오늘은 술 대신 바람이나 쐬려고 나왔어요."
        acknowledgement: "어제 많이 피곤하셨나 봐요."
        weekend_answer: "오늘은 무리하지 말고 쉬시는 게 좋겠네요."
        perceived_self_image: "흐트러진 날도 솔직하게 인정하는 사람으로 보였겠지."
        reality_response_thought: "과장님이 피곤해서 혼자 술을 마셨다는 이야기까지 먼저 꺼내셨네."
        reality_limit: "피곤해서 혼자 술을 마셨다는 자기보고일 뿐, 상대가 친밀감을 느꼈다는 뜻은 아니었다."
  expressions:
    feedback.last_workout:
      requires: {last_activity: workout}
      score_bonus: 0
    feedback.last_reading:
      requires: {last_activity: reading}
      score_bonus: 0
    feedback.last_ott:
      requires: {last_activity: ott}
      score_bonus: 0
    feedback.last_sleep:
      requires: {last_activity: sleep}
      score_bonus: 0
    feedback.last_solo_drinking:
      requires: {last_activity: solo_drinking}
      score_bonus: 0
    health.workout_answer:
      requires: {appeal_gte: 32, stat: health, minimum: 2, fatigue_lte: 4}
      score_bonus: 2
    intelligence.contextual_answer:
      requires: {appeal_gte: 31, stat: intelligence, minimum: 2, fatigue_lte: 4}
      score_bonus: 2
    humor.trend_topic:
      requires: {appeal_gte: 29, stat: humor, minimum: 2, fatigue_lte: 4}
      score_bonus: 2
    humor.boundary_joke:
      requires: {appeal_gte: 30, stat: humor, minimum: 2, fatigue_lte: 3}
      score_bonus: 2

files:
  ui: ui.yaml
  game_modes: game_modes.yaml
  world: world/**/*.yaml
  campaigns: campaigns/*.yaml
  characters: characters/*.yaml
  events: events/**/*.yaml
  locales: locales/*.yaml
  visuals: visuals/**/*.yaml
  threads: threads/*.yaml
  meta: meta/*.yaml
  routes: routes/*.yaml
  scenes: scenes/**/*.yaml

localization_quality:
  required_accessibility_keys:
    - app.title
    - locale.label
    - menu.main
    - menu.close
    - hud.gameMenu
    - menu.game
  profiles:
    development:
      missing_translation: ignore
      identical_translation: ignore
      maximum_length: ignore
    release:
      missing_translation: warning
      required_locales:
        en:
          minimum_direct_ratio: 1.0
          required_domains: [ui]

build:
  runtime_output: build/story-runtime.json
  context_output: build/ai-context.json
