schema_version: 1
project:
  id: love_office_story_1
  title: 밀당 오피스 - 초필살 다크 스킬로 그녀의 마음을 캐에에에에엣치 존잘 중년 이야기
  default_language: ko
  supported_languages: [ko, en]

id_pattern: "^[a-z][a-z0-9_.]*$"

enums:
  time_slot: [morning, lunch, afternoon, after_work]
  event_type: [anchor, heroine, company, offscreen, ending]
  event_availability: [automatic, player, hidden]
  event_completion: [return_to_timeline, honor_scene_exit]
  presentation_flag:
  - ui_glitch
  - ui_label_reveal
  - protagonist_art_reveal
  visual_kind: [background_archetype, background, character_archetype, character]
  render_strategy: [flat_portrait, layered_sprite, background]
  stage_position: [far_left, left, center, right, far_right]
  node_kind:
  - dialogue
  - narration
  - silent
  - choice
  - state_gate
  - effect
  - exit
stats:
  visible.protagonist.self_development.appeal:
    type: integer
    min: 0
    max: 100
    description: 서정우가 스스로 평가하는 매력도
  visible.protagonist.self_development.stats.health:
    type: integer
    min: 0
    max: 5
    description: 운동과 생활 관리 관련 대화 표현을 여는 건강
  visible.protagonist.self_development.stats.appearance:
    type: integer
    min: 0
    max: 5
    description: 자기관리 관련 대화 표현을 여는 외모 관리
  visible.protagonist.self_development.stats.humor:
    type: integer
    min: 0
    max: 5
    description: 가벼운 농담 표현을 여는 유머 감각
  visible.protagonist.self_development.stats.intelligence:
    type: integer
    min: 0
    max: 5
    description: 독서와 업무 맥락 관련 대화 표현을 여는 지성
  visible.protagonist.self_development.fatigue:
    type: integer
    min: 0
    max: 6
    description: 밤 활동과 고급 표현 사용을 제한하는 피로도
  visible.affection:
    type: integer
    min: 0
    max: 100
    description: 플레이어와 서정우에게 공략 성공으로 보이는 표면 호감도
  hidden.suspicion:
    type: integer
    min: 0
    max: 100
    description: 의도적 접근이나 위험을 의심하는 정도
  hidden.dislike:
    type: integer
    min: 0
    max: 100
    description: 쉽게 회복되지 않는 누적 거부감
  hidden.evidence_count:
    type: integer
    min: 0
    max: 99
    description: 제시 가능한 물리적 증거의 개수
  progress.time.day:
    type: integer
    min: 1
    max: 17
    description: 현재 캠페인 날짜
  progress.time.act:
    type: integer
    min: 1
    max: 3
    description: 현재 이야기 막
  progress.time.slot:
    type: enum
    values: [morning, lunch, afternoon, after_work]
    description: 현재 시간대

state_path_patterns:
- pattern: "^visible\\.protagonist\\.self_development\\.(appeal|fatigue)$"
  stat_from_path: true
- pattern: "^visible\\.protagonist\\.self_development\\.stats\\.(health|appearance|humor|intelligence)$"
  stat_from_path: true
- pattern: "^visible\\.heroines\\.[a-z][a-z0-9_]*\\.affection$"
  stat_from_suffix: true
- pattern: "^hidden\\.heroines\\.[a-z][a-z0-9_]*\\.(suspicion|dislike|evidence_count)$"
  stat_from_suffix: true
- pattern: "^progress\\.(cleared_routes|unlocked_modes)$"
  type: array
- pattern: "^progress\\.flags$"
  type: map
- pattern: "^progress\\.flags\\.[a-z][a-z0-9_.]*$"
  type: any
- pattern: "^progress\\.time\\.(day|act|slot)$"
  stat_from_path: true
- pattern: "^progress\\.events\\.(seen|missed|expired)$"
  type: array
- pattern: "^progress\\.memories$"
  type: array
- pattern: "^progress\\.self_development\\.(completed_days|activity_history)$"
  type: array
- pattern: "^progress\\.self_development\\.last_activity$"
  type: string
- pattern: "^progress\\.self_development\\.hint_charges$"
  type: integer
  min: 0
  max: 9

initial_state:
  visible:
    protagonist:
      self_development:
        appeal: 30
        stats:
          health: 0
          appearance: 0
          humor: 0
          intelligence: 0
        fatigue: 1
    heroines:
      yoon_seo_a:
        affection: 50
      cha_min_kyung:
        affection: 50
      kang_yoo_jin:
        affection: 30
  hidden:
    heroines:
      yoon_seo_a:
        suspicion: 0
        dislike: 0
        evidence_count: 0
      cha_min_kyung:
        suspicion: 0
        dislike: 10
        evidence_count: 0
      kang_yoo_jin:
        suspicion: 35
        dislike: 15
        evidence_count: 0
  progress:
    time:
      day: 1
      act: 1
      slot: morning
    events:
      seen: []
      missed: []
      expired: []
    memories: []
    cleared_routes: []
    unlocked_modes: [base]
    self_development:
      completed_days: []
      activity_history: []
      last_activity: ""
      hint_charges: 0
    flags:
      dark_psychology:
        chapter_2_read: false
        chapter_4_2_read: false
        chapter_1_2_read: false
      push_pull:
        combo: 0
        position: 0
        target: none
        last_action: none
        heroine: ""
      story_mode:
        target: none
        day_02_response: none
        final_interpretation: undecided
        home_incident: none
        yoo_jin_intervention: false

self_development:
  max_night_day: 16
  activities:
  - id: workout
    appeal_delta: 3
    fatigue_delta: 2
    stat_deltas: {health: 2, appearance: 1}
    fatigue_lte: 4
  - id: reading
    appeal_delta: 1
    fatigue_delta: 1
    stat_deltas: {intelligence: 2}
    fatigue_lte: 5
  - id: ott
    appeal_delta: -1
    fatigue_delta: -1
    stat_deltas: {humor: 2}
  - id: sleep
    appeal_delta: 0
    fatigue_delta: -4
    stat_deltas: {}
  - id: dark_psychology
    appeal_delta: 0
    fatigue_delta: 2
    stat_deltas: {}
    fatigue_lte: 4
    hint_charge: 1
  - id: solo_drinking
    selectable: false
    appeal_delta: -1
    fatigue_delta: -2
    stat_deltas: {health: -1}
    fatigue_gte: 5
  expressions:
    feedback.last_workout:
      requires: {last_activity: workout}
      score_bonus: 0
    feedback.last_reading:
      requires: {last_activity: reading}
      score_bonus: 0
    feedback.last_ott:
      requires: {last_activity: ott}
      score_bonus: 0
    feedback.last_sleep:
      requires: {last_activity: sleep}
      score_bonus: 0
    feedback.last_dark_psychology:
      requires: {last_activity: dark_psychology}
      score_bonus: 0
    feedback.last_solo_drinking:
      requires: {last_activity: solo_drinking}
      score_bonus: 0
    health.workout_answer:
      requires: {appeal_gte: 32, stat: health, minimum: 2, fatigue_lte: 4}
      score_bonus: 0
    intelligence.contextual_answer:
      requires: {appeal_gte: 31, stat: intelligence, minimum: 2, fatigue_lte: 4}
      score_bonus: 0
    humor.trend_topic:
      requires: {appeal_gte: 29, stat: humor, minimum: 2, fatigue_lte: 4}
      score_bonus: 0
    humor.boundary_joke:
      requires: {appeal_gte: 30, stat: humor, minimum: 2, fatigue_lte: 3}
      score_bonus: 0

gallery:
  entries:
  - id: office_lineup
    title_key: gallery.entry.office_lineup.title
    description_key: gallery.entry.office_lineup.description
    asset: assets/concept-art/lineup-v1.png
    unlock_memory: cg.office_lineup
    default_unlocked: true
  - id: health_min_kyung
    title_key: gallery.entry.health_min_kyung.title
    description_key: gallery.entry.health_min_kyung.description
    asset: assets/concept-art-archive/cha-min-kyung-original-v1.png
    unlock_memory: cg.stat.health.min_kyung
    source_stat: health
    source_minimum: 3
  - id: appearance_yoo_jin
    title_key: gallery.entry.appearance_yoo_jin.title
    description_key: gallery.entry.appearance_yoo_jin.description
    asset: assets/concept-art-archive/kang-yoo-jin-original-v1.png
    unlock_memory: cg.stat.appearance.yoo_jin
    source_stat: appearance
    source_minimum: 3
  - id: humor_seo_a
    title_key: gallery.entry.humor_seo_a.title
    description_key: gallery.entry.humor_seo_a.description
    asset: assets/concept-art-archive/yoon-seo-a-original-v1.png
    unlock_memory: cg.stat.humor.seo_a
    source_stat: humor
    source_minimum: 3
  - id: intelligence_min_kyung
    title_key: gallery.entry.intelligence_min_kyung.title
    description_key: gallery.entry.intelligence_min_kyung.description
    asset: assets/concept-art/cha-min-kyung.png
    unlock_memory: cg.stat.intelligence.min_kyung
    source_stat: intelligence
    source_minimum: 3

files:
  ui: ui.yaml
  game_modes: game_modes.yaml
  world: world/**/*.yaml
  campaigns: campaigns/*.yaml
  characters: characters/*.yaml
  events: events/**/*.yaml
  locales: locales/*.yaml
  visuals: visuals/**/*.yaml
  threads: threads/*.yaml
  meta: meta/*.yaml
  routes: routes/*.yaml
  scenes: scenes/**/*.yaml
  system_flows: system_flows/*.yaml

localization_quality:
  required_accessibility_keys:
  - app.title
  - locale.label
  - menu.main
  - menu.close
  - hud.gameMenu
  - menu.game
  profiles:
    development:
      missing_translation: ignore
      identical_translation: ignore
      maximum_length: ignore
    release:
      missing_translation: warning
      required_locales:
        en:
          minimum_direct_ratio: 1.0
          required_domains: [ui]

build:
  runtime_output: build/story-runtime.json
  context_output: build/ai-context.json
