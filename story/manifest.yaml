schema_version: 1
project:
  id: love_office_story_1
  title: 밀당 오피스 - 초필살 다크 스킬로 그녀의 마음을 캐에에에에엣치 존잘 중년 이야기
  default_language: ko
  supported_languages: [ko, en]

id_pattern: "^[a-z][a-z0-9_.]*$"

enums:
  perceived_state: [push, pull, neutral]
  time_slot: [morning, lunch, afternoon, after_work]
  event_type: [anchor, heroine, company, offscreen, ending]
  event_availability: [automatic, player, hidden]
  event_completion: [return_to_timeline, honor_scene_exit]
  presentation_flag: [original_text_lock, ui_glitch, ui_label_reveal, auditory_distortion, romance_insert, inner_voice]
  visual_kind: [background_archetype, background, character_archetype, character]
  render_strategy: [flat_portrait, layered_sprite, background]
  stage_position: [far_left, left, center, right, far_right]
  atmosphere:
    - warm_romance
    - playful_tension
    - cold_office
    - guarded_office
    - procedural
    - dread
  intent:
    - courtesy
    - boundary
    - avoidance
    - relief
    - documentation
    - confrontation
    - self_protection
    - self_promotion
    - work_only
  node_kind:
    - dual_dialogue
    - dual_narration
    - choice
    - state_gate
    - effect
    - exit

stats:
  visible.protagonist.self_development.appeal:
    type: integer
    min: 0
    max: 100
    description: 한도윤이 스스로 평가하는 매력도
  visible.protagonist.self_development.stats.stamina:
    type: integer
    min: 0
    max: 5
    description: 활동적인 대화 표현을 여는 체력
  visible.protagonist.self_development.stats.appearance:
    type: integer
    min: 0
    max: 5
    description: 자기관리 관련 대화 표현을 여는 외모 관리
  visible.protagonist.self_development.stats.humor:
    type: integer
    min: 0
    max: 5
    description: 가벼운 농담 표현을 여는 유머 감각
  visible.protagonist.self_development.stats.taste:
    type: integer
    min: 0
    max: 5
    description: 콘텐츠와 유행 화제를 여는 취향 지식
  visible.protagonist.self_development.fatigue:
    type: integer
    min: 0
    max: 6
    description: 밤 활동과 고급 표현 사용을 제한하는 피로도
  visible.affection:
    type: integer
    min: 0
    max: 100
    description: 주인공이 사랑받는다고 확신하는 정도
  visible.initiative:
    type: integer
    min: 0
    max: 100
    description: 주인공이 밀당을 통제한다고 믿는 정도
  visible.perceived_state:
    type: enum
    values: [push, pull, neutral]
    description: 주인공이 해석한 상대의 현재 상태
  hidden.suspicion:
    type: integer
    min: 0
    max: 100
    description: 의도적 접근이나 위험을 의심하는 정도
  hidden.dislike:
    type: integer
    min: 0
    max: 100
    description: 쉽게 회복되지 않는 누적 거부감
  hidden.evidence_count:
    type: integer
    min: 0
    max: 99
    description: 제시 가능한 물리적 증거의 개수
  progress.time.day:
    type: integer
    min: 1
    max: 17
    description: 현재 캠페인 날짜
  progress.time.act:
    type: integer
    min: 1
    max: 3
    description: 현재 이야기 막
  progress.time.slot:
    type: enum
    values: [morning, lunch, afternoon, after_work]
    description: 현재 시간대

state_path_patterns:
  - pattern: "^visible\\.protagonist\\.self_development\\.(appeal|fatigue)$"
    stat_from_path: true
  - pattern: "^visible\\.protagonist\\.self_development\\.stats\\.(stamina|appearance|humor|taste)$"
    stat_from_path: true
  - pattern: "^visible\\.heroines\\.[a-z][a-z0-9_]*\\.(affection|initiative|perceived_state)$"
    stat_from_suffix: true
  - pattern: "^hidden\\.heroines\\.[a-z][a-z0-9_]*\\.(suspicion|dislike|evidence_count)$"
    stat_from_suffix: true
  - pattern: "^progress\\.(cleared_routes|unlocked_modes)$"
    type: array
  - pattern: "^progress\\.flags$"
    type: map
  - pattern: "^progress\\.flags\\.[a-z][a-z0-9_.]*$"
    type: any
  - pattern: "^progress\\.time\\.(day|act|slot)$"
    stat_from_path: true
  - pattern: "^progress\\.events\\.(seen|missed|expired)$"
    type: array
  - pattern: "^progress\\.memories$"
    type: array
  - pattern: "^progress\\.self_development\\.(completed_days|activity_history)$"
    type: array
  - pattern: "^progress\\.self_development\\.last_activity$"
    type: string

initial_state:
  visible:
    protagonist:
      self_development:
        appeal: 30
        stats:
          stamina: 0
          appearance: 0
          humor: 0
          taste: 0
        fatigue: 1
    heroines:
      yoon_seo_a:
        affection: 5
        initiative: 50
        perceived_state: neutral
      cha_min_kyung:
        affection: 5
        initiative: 50
        perceived_state: neutral
      kang_yoo_jin:
        affection: 0
        initiative: 30
        perceived_state: neutral
  hidden:
    heroines:
      yoon_seo_a:
        suspicion: 0
        dislike: 0
        evidence_count: 0
      cha_min_kyung:
        suspicion: 0
        dislike: 10
        evidence_count: 0
      kang_yoo_jin:
        suspicion: 35
        dislike: 15
        evidence_count: 0
  progress:
    time:
      day: 1
      act: 1
      slot: morning
    events:
      seen: []
      missed: []
      expired: []
    memories: []
    cleared_routes: []
    unlocked_modes: [base]
    self_development:
      completed_days: []
      activity_history: []
      last_activity: ""
    flags:
      push_pull:
        combo: 0
        position: 0
        target: none
        last_action: none
        heroine: ""
      story_mode:
        target: none
        final_interpretation: undecided
        home_incident: none
        yoo_jin_intervention: false

self_development:
  max_night_day: 16
  activities:
    - id: workout
      title_key: selfDevelopment.activity.workout.title
      description_key: selfDevelopment.activity.workout.description
      reflection_keys:
        perceived: selfDevelopment.activity.workout.reflection.perceived
        reality: selfDevelopment.activity.workout.reflection.reality
      appeal_delta: 3
      fatigue_delta: 2
      stat_deltas: {stamina: 2, appearance: 1}
      fatigue_lte: 4
    - id: grooming
      title_key: selfDevelopment.activity.grooming.title
      description_key: selfDevelopment.activity.grooming.description
      reflection_keys:
        perceived: selfDevelopment.activity.grooming.reflection.perceived
        reality: selfDevelopment.activity.grooming.reflection.reality
      appeal_delta: 3
      fatigue_delta: 1
      stat_deltas: {appearance: 2}
      fatigue_lte: 5
    - id: ott
      title_key: selfDevelopment.activity.ott.title
      description_key: selfDevelopment.activity.ott.description
      reflection_keys:
        perceived: selfDevelopment.activity.ott.reflection.perceived
        reality: selfDevelopment.activity.ott.reflection.reality
      appeal_delta: -1
      fatigue_delta: -1
      stat_deltas: {humor: 2, taste: 1}
    - id: reels
      title_key: selfDevelopment.activity.reels.title
      description_key: selfDevelopment.activity.reels.description
      reflection_keys:
        perceived: selfDevelopment.activity.reels.reflection.perceived
        reality: selfDevelopment.activity.reels.reflection.reality
      appeal_delta: -1
      fatigue_delta: -2
      stat_deltas: {humor: 1, taste: 1}
    - id: sleep
      title_key: selfDevelopment.activity.sleep.title
      description_key: selfDevelopment.activity.sleep.description
      reflection_keys:
        perceived: selfDevelopment.activity.sleep.reflection.perceived
        reality: selfDevelopment.activity.sleep.reflection.reality
      appeal_delta: 0
      fatigue_delta: -4
      stat_deltas: {}
  expressions:
    stamina.change_notice:
      requires: {appeal_gte: 32, stat: stamina, minimum: 2, fatigue_lte: 4}
      score_bonus: 0
    stamina.workout_answer:
      requires: {appeal_gte: 32, stat: stamina, minimum: 2, fatigue_lte: 4}
      score_bonus: 2
    appearance.grooming_answer:
      requires: {appeal_gte: 34, stat: appearance, minimum: 2, fatigue_lte: 4}
      score_bonus: 2
    taste.trend_topic:
      requires: {appeal_gte: 32, stat: taste, minimum: 2, fatigue_lte: 4}
      score_bonus: 2
    humor.boundary_joke:
      requires: {appeal_gte: 30, stat: humor, minimum: 2, fatigue_lte: 3}
      score_bonus: 2

files:
  ui: ui.yaml
  world: world/**/*.yaml
  campaigns: campaigns/*.yaml
  characters: characters/*.yaml
  events: events/**/*.yaml
  locales: locales/*.yaml
  visuals: visuals/**/*.yaml
  threads: threads/*.yaml
  meta: meta/*.yaml
  routes: routes/*.yaml
  scenes: scenes/**/*.yaml

localization_quality:
  required_accessibility_keys:
    - app.title
    - locale.label
    - menu.main
    - menu.close
    - hud.gameMenu
    - menu.game
  profiles:
    development:
      missing_translation: ignore
      identical_translation: ignore
      maximum_length: ignore
    release:
      missing_translation: warning
      required_locales:
        en:
          minimum_direct_ratio: 1.0
          required_domains: [ui]

build:
  runtime_output: build/story-runtime.json
  context_output: build/ai-context.json
