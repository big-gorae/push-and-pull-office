schema_version: 1
id: system.night_activity
title: 밤 활동
nodes:
- id: intro
  kind: dialogue
  line: 밥을 먹으며 《여성의 마음을 지배하는 어둠의 심리학》을 몇 쪽 읽었다. 이제 뭘 할까?
  speaker: han_do_yoon
- id: forced_intro
  kind: dialogue
  line: 《여성의 마음을 지배하는 어둠의 심리학》을 몇 줄 읽었지만 눈에 들어오지 않는다. 오늘은 뭘 고를 기운도 없네.
  speaker: han_do_yoon
- id: activity_result
  kind: dialogue
  variants:
  - id: workout
    line: 숨은 차지만 몸을 쓴 보람은 있네. 오늘은 여기까지 하자.
  - id: reading
    line: 생각보다 잘 읽히네. 내일 출근길에 조금 더 봐야겠어.
  - id: ott
    line: 한 편만 보려 했는데 벌써 세 편이네. 그래도 요즘 농담은 좀 알겠어.
  - id: sleep
    line: 오늘은 욕심내지 말고 자자. 내일 생각은 내일 하고.
  - id: dark_psychology
    line: 오늘 배운 강의는 결정적인 순간에 한 번 써먹을 수 있겠군.
  - id: solo_drinking
    line: 한 잔만 마시려 했는데… 빈 캔이 세 개네. 불부터 끄자.
options:
- id: workout
  label: 헬스장에 간다
  description: 건강과 외모가 오르고 피로가 쌓인다.
- id: reading
  label: 독서를 한다
  description: 지성이 오르고 피로가 조금 쌓인다.
- id: ott
  label: OTT를 시청한다
  description: 유머가 오르고 피로가 줄지만 매력도가 조금 내려간다.
- id: sleep
  label: 일찍 잠든다
  description: 피로를 크게 회복한다.
- id: dark_psychology
  label: 《여성의 마음을 지배하는 어둠의 심리학》 추가 학습
  description: 피로가 쌓이지만 선택 전에 강사의 분석을 한 번 떠올릴 수 있다.
- id: solo_drinking
  label: 혼자 술을 마신다
  description: 고피로일 때 강제로 발생한다.
