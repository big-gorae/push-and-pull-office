[package]
name = "push-and-pull-office-editor"
version = "0.1.0"
description = "Story branch editor for Push and Pull Office"
authors = ["Push and Pull Office"]
edition = "2021"

[lib]
name = "push_and_pull_office_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.6.0"
